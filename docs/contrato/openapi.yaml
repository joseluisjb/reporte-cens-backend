                numero_obligacion: 2241-3302
                nombre_titular: Panadería El Trigal
                tipologia: { codigo: '03', descripcion: Titular no reconoce la obligación, confirmado: false }
                fecha_radicacion: '2026-08-30'
                observacion: El titular no reconoce la obligación.
                estado: CERRADO
                marcacion_generada: true
                desmarcacion_generada: false
                fecha_limite_respuesta: '2026-09-18'
                vencido: false
                resultado: Procedente
                fecha_cierre: '2026-09-17'
                observacion_cierre: Se corrigió el titular de la obligación.
                registrado_por: Juan Pérez
