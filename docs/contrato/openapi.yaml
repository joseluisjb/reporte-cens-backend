                  registrada_por: Juan Pérez
                  fecha_registro: '2026-09-30T11:00:00-05:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Novedades]
      summary: Registrar una rectificación de un corte enviado (RF55)
      description: |
        Guarda la corrección **sin borrar** el valor original (`valor_anterior` lo toma el sistema del
        corte afectado) y prepara el insumo para TransUnion. Solo sobre cortes enviados.
        **0.9.5:** la respuesta del `201` trae `insumo`, como ya lo hace el backend. Su formato
        (`número|campo|valor corregido`) está **por confirmar con TransUnion**: el Manual (p. 57,
        «Novedades Batch») dice que las correcciones masivas usan archivos de estructura fija, pero no
        la da.
        **0.9.2:** acepta `novedad_id` (opcional) para enlazarla con la novedad de tipo `CORRECCION`
        que la originó; la pantalla 14 crea primero la novedad y después la rectificación. `400` en
        `novedad_id` si la novedad no existe. *Propuesta; pantalla de Angel.*
      operationId: rectificacionesCreate
      x-roles: [Analista de Cartera]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RectificacionCreateRequest' }
            example: { novedad_id: 2, obligacion_id: 2, corte_id: 1, campo: valor_mora, valor_corregido: '70000', justificacion: 'El corte 31/08/2026 reportó un valor en mora errado.', medio: ACTUALIZACION_LINEA }
      responses:
        '201':
          description: Rectificación registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rectificacion' }
              example:
                id: 1
                novedad_id: 2
                obligacion_id: 2
                numero_obligacion: 2258-7731
                corte_id: 1
                fecha_corte: '2026-08-31'
                campo: valor_mora
                valor_anterior: '140000'
                valor_corregido: '70000'
                justificacion: 'El corte 31/08/2026 reportó un valor en mora errado.'
                medio: ACTUALIZACION_LINEA
                estado: REGISTRADA
                confirmacion_tu: null
                registrada_por: Juan Pérez
                fecha_registro: '2026-09-30T11:00:00-05:00'
        '400':
          description: Datos inválidos (por campo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { justificacion: ['Escribe la justificación de la corrección.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El corte no fue enviado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Solo se rectifican cortes ya enviados a TransUnion.' }

  /rectificaciones/{id}/confirmar/:
    post:
      tags: [Novedades]
      summary: Registrar la confirmación de TransUnion de una rectificación (RF55)
      description: "*Propuesta; pantalla de Angel.*"
      operationId: rectificacionesConfirmar
      x-roles: [Analista de Cartera]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RectificacionConfirmarRequest' }
            example: { confirmacion_tu: TU-AL-001610 }
      responses:
        '200':
          description: Rectificación confirmada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rectificacion' }
              example:
                id: 1
                novedad_id: 2
                obligacion_id: 2
                numero_obligacion: 2258-7731
                corte_id: 1
                fecha_corte: '2026-08-31'
                campo: valor_mora
                valor_anterior: '140000'
                valor_corregido: '70000'
                justificacion: 'El corte 31/08/2026 reportó un valor en mora errado.'
                medio: ACTUALIZACION_LINEA
                estado: CONFIRMADA
                confirmacion_tu: TU-AL-001610
                registrada_por: Juan Pérez
                fecha_registro: '2026-09-30T11:00:00-05:00'
        '400':
          description: Datos inválidos (por campo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { confirmacion_tu: ['Ingresa el número de confirmación de TransUnion.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La rectificación no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Rectificación no encontrada.' }
        '409':
          description: Ya está confirmada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'La rectificación ya está confirmada.' }

  # ───────────────────────── Datos de la entidad (pantalla 15) ─────────────────────────
  /entidad/:
    get:
      tags: [Entidad]
      summary: Datos de la entidad ante TransUnion (RF57)
      description: |
        Tipo de entidad (3 dígitos, Tabla 29), código de entidad (3 dígitos, Tabla 30) y código de
        sucursal (6 caracteres). Mientras TransUnion no los asigne llevan el **marcador** `XXX`,
        `XXX` y `XXXXXX` (mismo largo del campo) y los archivos salen no aptos para envío. Lectura
        para ambos roles (el Analista ve el aviso en el panel y en la pantalla 12). *Propuesta.*
      operationId: entidadRead
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Datos vigentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entidad' }
              example:
                tipo_entidad: XXX
                codigo_entidad: XXX
                codigo_sucursal: XXXXXX
                con_marcador: true
                prefijo_archivo: SSRXXXXXX
                actualizado_por: null
                fecha_actualizacion: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Entidad]
      summary: Guardar los datos de la entidad (RF57)
      description: |
        Reemplaza los tres datos. Cada uno debe tener su largo exacto: el tipo y el código de entidad,
        3 dígitos o el marcador `XXX`; la sucursal, 6 letras mayúsculas o dígitos (`XXXXXX` es el
        marcador). Para «volver al relleno» se envían los tres marcadores. Queda en la bitácora.
        *Propuesta.*
      operationId: entidadUpdate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntidadUpdateRequest' }
            example: { tipo_entidad: '001', codigo_entidad: '123', codigo_sucursal: A1B2C3 }
      responses:
        '200':
          description: Datos guardados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entidad' }
              example:
                tipo_entidad: '001'
                codigo_entidad: '123'
                codigo_sucursal: A1B2C3
                con_marcador: false
                prefijo_archivo: SSR001123
                actualizado_por: Rosa Martínez
                fecha_actualizacion: '2026-11-07T10:00:00-05:00'
        '400':
          description: Algún dato no tiene el largo o el tipo del campo (por campo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              examples:
                tipo:
                  summary: Tipo de entidad de 2 dígitos
                  value: { tipo_entidad: ['El tipo de entidad debe tener 3 dígitos (o XXX mientras TransUnion no los asigne).'] }
                sucursal:
                  summary: Sucursal con caracteres no permitidos
                  value: { codigo_sucursal: ['El código de sucursal debe tener 6 caracteres (o XXXXXX mientras TransUnion no los asigne).'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── Panel principal (pantalla 4) ─────────────────────────
  /panel/resumen/:
    get:
      tags: [Panel]
      summary: Tarjetas de HU-B y HU-C del panel del Analista (RF6, RF19, RF23, RF24, RF57)
      description: |
        Lo que muestra el panel del Analista: distribución de la cartera por estado, último archivo
        para TransUnion, reclamos abiertos, novedades pendientes, obligaciones abiertas con 2 o más
        cuotas en mora y si la entidad lleva marcador. El Administrador no ve estas tarjetas (y
        recibe `403`). *Propuesta.*
      operationId: panelResumen
      x-roles: [Analista de Cartera]
      responses:
        '200':
          description: Resumen del panel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelResumen' }
              example:
                fecha_ultimo_ciclo: '2026-09-30'
                total_obligaciones: 12
                distribucion:
                  - { estado_tu: '01', cantidad: 7 }
                  - { estado_tu: '03', cantidad: 1 }
                  - { estado_tu: '06', cantidad: 1 }
                  - { estado_tu: '02', cantidad: 2 }
                  - { estado_tu: '07', cantidad: 1 }
                ultimo_archivo:
                  id: 2
                  corte_id: 2
                  fecha_corte: '2026-09-30'
                  nombre: SSRXXXXXX20260930
                  tipo_reporte: '01'
                  fecha_generacion: '2026-10-01T09:20:00-05:00'
                  generado_por: Juan Pérez
                  n_registros: 11
                  total_registros: 13
                  n_excluidas: 1
                  saldo_total: 21863586
                  longitud_registro_tipo2: 930
                  apto_envio: false
                  motivo_no_apto: 'La entidad tiene datos con relleno (XXX): TransUnion lo rechazaría.'
                  enviado: false
                  fecha_envio: null
                  estado_corte: VALIDADO
                  tiene_resultados: false
                en_reclamo: 2
                novedades_pendientes: 2
                con_dos_o_mas_cuotas: 5
                entidad_con_marcador: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Cookie de sesión de Django (HttpOnly). Los métodos que modifican datos exigen además el encabezado `X-CSRFToken`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Valor de la cookie `csrftoken`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: |
        Entero. Una ruta con un `id` no numérico no existe: el backend responde `404` con la página
        de error de Django, **no** con `{ detail }` (diferencia AD del README).
      schema: { type: integer }
    Codigo:
      name: codigo
      in: path
      required: true
      description: Código del concepto en el sistema comercial de CENS (entero de 1 a 9999).
      schema: { type: integer, minimum: 1, maximum: 9999 }
    Limite:
      name: limite
      in: query
      description: |
        Máximo de filas a devolver. Por defecto 20. Debe ser un entero de 1 a 100: un valor menor
        que 1 responde `400` y **un valor mayor que 100 se recorta a 100**. Implementado en el
        backend.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Desplazamiento:
      name: desplazamiento
      in: query
      description: |
        Cuántas filas saltarse (desde 0). Por defecto 0. Un valor negativo responde `400`.
        Implementado en el backend.
      schema: { type: integer, minimum: 0, default: 0 }
    CorteId:
      name: corte_id
      in: path
      required: true
      description: Id del corte (el mismo de `/extracciones/{id}/`).
      schema: { type: integer }

  responses:
    ValidationError:
      description: Error de validación (RF31). Mensajes en español, por campo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorCampos' }
          example: { nombre: ['Ingresa el nombre completo.'] }
    Unauthorized:
      description: Sin sesión o sesión vencida por inactividad.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'Tu sesión venció. Inicia sesión de nuevo.', code: not_authenticated }
    Forbidden:
      description: |
        Sin permiso. Distinguir por `code`: `permission_denied` (rol insuficiente),
        `password_change_required` (primer ingreso pendiente), `csrf_failed` (token CSRF inválido).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'No tienes permiso para realizar esta acción.', code: permission_denied }
    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'No se encontró el recurso solicitado.', code: not_found }
    TooManyRequests:
      description: Demasiados intentos. Reintentar más tarde.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos de espera.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'Demasiados intentos. Intenta de nuevo en unos minutos.', code: throttled }
    UnprocessableEntity:
      description: El archivo cargado no corresponde o no tiene la estructura esperada; no se guardó nada (0.9, RF54).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          examples:
            otro_corte:
              summary: Archivo de otro corte
              value: { detail: 'El archivo Detalle_Inco_CSR_001_123_Correctivas_20260731.txt es del corte 31/07/2026, no del 31/08/2026.', code: archivo_de_otro_corte }
            estructura:
              summary: Estructura distinta a la esperada
              value: { detail: 'El archivo Detalle_Inco_CSR_001_123_Correctivas_20260831.txt no tiene la estructura esperada (línea 3: no trae el registro tipo 2 con el código, la descripción y el tipo de la inconsistencia).', code: estructura_invalida }

  schemas:
    # ── Errores ──
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Mensaje en español para mostrar al usuario. }
        code: { type: string, description: Identificador estable del error (opcional). }
    ErrorCampos:
      type: object
      description: Un arreglo de mensajes por cada campo con error.
      additionalProperties:
        type: array
        items: { type: string }

    # ── Paginación ──
    ListaPaginada:
      type: object
      required: [total, resultados]
      description: Respuesta de los listados que pueden crecer. Se pide con `?limite=` y `?desplazamiento=`.
      properties:
        total: { type: integer, minimum: 0, description: Total de registros que cumplen el filtro (no solo los de esta página). }
        resultados: { type: array, items: {} }

    # ── Usuarios y autenticación ──
    Rol:
      type: string
      enum: [ANALISTA_CARTERA, ADMINISTRADOR]
      description: Códigos que usa el backend (`request.user.rol`, modelo `usuarios.Usuario`). El frontend los muestra como "Analista de Cartera" y "Administrador". Confirmado en el backend (RF25, 0.6).
    User:
      type: object
      required: [id, nombre, email, rol, is_active, last_login, must_change_password]
      properties:
        id: { type: integer, example: 2 }
        nombre: { type: string, example: Rosa Martínez }
        email: { type: string, format: email, example: rmartinez@example.com }
        rol: { $ref: '#/components/schemas/Rol' }
        is_active: { type: boolean }
        last_login: { type: string, format: date-time, nullable: true, description: Último acceso; `null` si nunca ingresó. }
        must_change_password: { type: boolean, description: "`true` mientras el usuario no cambie su contraseña temporal." }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LogoutRequest:
      type: object
      description: Opcional (0.7). Solo cambia el detalle del registro de auditoría.
      properties:
        motivo:
          type: string
          enum: [manual, inactividad]
          description: "`inactividad` → \"Cierre por inactividad\"; `manual` → \"Cierre manual\"."
      example: { motivo: inactividad }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password:
          type: string
          format: password
          description: Mínimo 8 caracteres, al menos una mayúscula y al menos un número. El backend también rechaza contraseñas comunes, parecidas al correo o al nombre e iguales a la actual (un mensaje por regla, en `new_password`).
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password:
          type: string
          format: password
          description: Mismas reglas que `change-password`, salvo la de parecerse al correo o al nombre y la de ser igual a la actual, que aquí el backend no comprueba.
    UserCreateRequest:
      type: object
      required: [nombre, email, rol]
      properties:
        nombre: { type: string, minLength: 1 }
        email: { type: string, format: email, description: Correo corporativo; único. }
        rol: { $ref: '#/components/schemas/Rol' }
    UserUpdateRequest:
      type: object
      description: Todos los campos son opcionales; se envía solo lo que cambia.
      properties:
        nombre: { type: string, minLength: 1 }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
        is_active: { type: boolean }
    UserCreatedResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        temporary_password:
          type: string
          nullable: true
          description: La contraseña temporal se envía por correo, así que el backend **no la devuelve**; llega `null` o ausente. El campo se conserva porque el frontend ya sabe mostrarla una sola vez si algún día se devolviera.

    # ── Conceptos de energía ──
    Concepto:
      type: object
      required: [codigo, descripcion, activo]
      properties:
        codigo: { type: integer, minimum: 1, maximum: 9999, example: 30, description: Código del concepto de facturación en el sistema comercial de CENS (catálogo del 02/10/2026). }
        descripcion: { type: string, maxLength: 60, example: CUOTA FINANCIACION ENERGIA, description: "`\"\"` si la base no tiene descripción (la columna admite nulos)." }
        activo: { type: boolean, description: "`true` = Activo (reportable); `false` = Inactivo." }
        observacion: { type: string, maxLength: 200, nullable: true }
        fecha_creacion:
          type: string
          format: date-time
          description: "*(pendiente)* RF35 pide mostrar la fecha de creación, pero la tabla `NV_CONCEPTO_REPORTABLE` no tiene esa columna. Falta agregarla o sacarla de la auditoría."
    ConceptoCreateRequest:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo: { type: integer, minimum: 1, maximum: 9999 }
        descripcion: { type: string, minLength: 1, maxLength: 60 }
        activo: { type: boolean, default: true }
        observacion: { type: string, maxLength: 200, nullable: true }
    ConceptoUpdateRequest:
      type: object
      description: Todos los campos son opcionales. El código no se puede cambiar.
      properties:
        descripcion: { type: string, minLength: 1, maxLength: 60 }
        activo: { type: boolean }
        observacion: { type: string, maxLength: 200, nullable: true }

    # ── Grupos de conceptos (RF43) ──
    ConceptoResumen:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo: { type: integer, example: 30 }
        descripcion:
          type: string
          nullable: true
          example: CUOTA FINANCIACION ENERGIA
          description: Puede llegar `null` si la base no tiene descripción; a diferencia de `GET /conceptos/`, el backend no la cambia por `""` dentro de los grupos.
    GrupoConcepto:
      type: object
      required: [id, nombre, activo, conceptos, creado]
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, maxLength: 60, example: Energía financiada }
        activo: { type: boolean }
        conceptos:
          type: array
          items: { $ref: '#/components/schemas/ConceptoResumen' }
        creado:
          type: string
          format: date
          example: '2026-10-10'
          description: |
            Fecha de creación del grupo (`AAAA-MM-DD`). **Diferencia AB del README (resuelta en `3610b63`):**
            entre `9411d65` y `3610b63` el backend la devolvió como fecha-hora
            (`2026-10-10T00:00:00-05:00`); desde `3610b63` (`main` `e835f31`) vuelve a ser fecha. El
            frontend sigue tomando los 10 primeros caracteres, por si acaso.
    GrupoConceptoCreateRequest:
      type: object
      required: [nombre, conceptos]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 60 }
        conceptos:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 9999 }
          description: "Códigos de concepto, sin repetidos (con repetidos el backend responde `400` por campo: `No se permiten códigos repetidos.`); todos deben existir y estar activos."
          example: [30, 94]
    GrupoConceptoUpdateRequest:
      type: object
      description: Todos los campos son opcionales; `conceptos` reemplaza la lista completa.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 60 }
        activo: { type: boolean }
        conceptos:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 9999 }
          description: "Sin códigos repetidos (con repetidos el backend responde `400` por campo: `No se permiten códigos repetidos.`)."

    # ── Extracción y ciclo de corte ──
    CorteCreateRequest:
      type: object
      required: [fecha_corte]
      properties:
        fecha_corte: { type: string, format: date, example: '2026-09-30', description: "No puede ser futura." }
        grupo_id:
          type: integer
          minimum: 1
          nullable: true
          example: 1
          description: |
            Grupo de conceptos que define qué se considera energía en este corte (RF43). Opcional:
            omitido o `null` = todos los conceptos reportables (`REPORTABLE = 'S'`). Si se envía,
            debe existir y estar activo.
    EstadoCorte:
      type: string
      enum: [BORRADOR, VALIDADO, ENVIADO, ENVIADO_CON_INCONSISTENCIAS, ANULADO]
      description: |
        Estado del corte (negocio). Transiciones:
        `POST /extracciones/` crea el corte en `BORRADOR` (un `BORRADOR` de la misma fecha se
        reemplaza); `POST /extracciones/{id}/validar/` pasa `BORRADOR` a `VALIDADO`;
        `POST /extracciones/{id}/registrar-envio/` pasa `VALIDADO` a `ENVIADO`;
        `DELETE /extracciones/{id}/` borra un `BORRADOR` (no lo deja en `ANULADO`: lo elimina).
        `ANULADO` existe en la base pero **ninguna operación de la API lo produce todavía**; los
        listados lo excluyen. Solo puede haber un corte en `BORRADOR` a la vez.

        **0.9 (propuesta, RF54):** al cargar los resultados de TransUnion (`POST /archivos/{id}/resultados/`),
        un corte `ENVIADO` pasa a `ENVIADO_CON_INCONSISTENCIAS` si el cargue trae correctivas. Para todo
        lo demás (historial de reportes, regla A9, último corte enviado) cuenta como **enviado**.
    CorteResumen:
      type: object
      required: [id, fecha_corte, fecha_ejecucion, grupo, obligaciones, saldo_consolidado, estado, ejecutada_por]
      description: Resumen de un corte de cartera (lo devuelven la lista, el detalle, la creación y el ciclo de corte).
      properties:
        id: { type: integer, example: 1 }
        fecha_corte:
          type: string
          format: date
          example: '2026-09-30'
          description: "Fecha del corte (`AAAA-MM-DD`)."
        fecha_ejecucion:
          type: string
          format: date-time
          example: '2026-10-10T12:00:00-05:00'
          description: "Cuándo se generó el corte (`FECHA_GENERACION`), con zona horaria de Bogotá."
        grupo:
          type: object
          nullable: true
          description: Grupo de conceptos con el que se generó. `null` si se usaron todos los conceptos reportables.
          required: [id, nombre]
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Grupo ficticio A }
        obligaciones: { type: integer, minimum: 0, example: 150, description: Cantidad de obligaciones (filas) del corte. }
        saldo_consolidado: { type: integer, example: 45000000, description: "Suma del saldo de todas las obligaciones del corte, en pesos colombianos (COP)." }
        estado: { $ref: '#/components/schemas/EstadoCorte' }
        ejecutada_por:
          type: string
          nullable: true
          example: Juan Pérez
          description: |
            Nombre del usuario que generó (o regeneró) el corte. `null` si lo generó el proceso
            mensual (RF9) o si el corte es anterior a la fila 42. Implementado en la rama del backend
            `fix/api-mensajes-seguridad-auditoria` (PR #34, sin fusionar; diferencia Y del README);
            hasta la fusión, `main` lo devuelve siempre `null`.
    ReglaMensaje:
      type: object
      required: [regla, mensaje]
      description: Resultado de una regla de validación del corte.
      properties:
        regla: { type: string, example: SIN_IDENTIFICACION, description: Identificador estable de la regla. }
        mensaje: { type: string, example: Falta el tipo o el número de identificación, description: Texto en español para mostrar. }
        obligacion_id: { type: integer, nullable: true, description: "0.9: obligación a la que se refiere, si aplica." }
        numero_obligacion: { type: string, nullable: true, description: "0.9: su número, para mostrar." }
        campo: { type: string, nullable: true, description: "0.9: campo que falla, si aplica." }
    CorteValidado:
      description: El resumen del corte ya en `VALIDADO`, más las advertencias informativas.
      allOf:
        - $ref: '#/components/schemas/CorteResumen'
        - type: object
          required: [advertencias]
          properties:
            advertencias:
              type: array
              description: Reglas informativas que no bloquean la validación. Puede ser `[]`.
              items: { $ref: '#/components/schemas/ReglaMensaje' }
    ErrorCorrectivo:
      type: object
      required: [detail]
      description: |
        `409` de `validar`. Siempre trae `detail`. Cuando el corte tiene reglas correctivas sin
        resolver (y sigue en `BORRADOR`) trae además `errores`; cuando el corte no está en `BORRADOR`
        solo trae `detail`.
      properties:
        detail: { type: string, description: Mensaje en español para mostrar al usuario. }
        code: { type: string, description: Identificador estable del error (opcional). }
        errores:
          type: array
          description: Reglas correctivas que fallaron. Solo está cuando el `409` es por errores correctivos.
          items: { $ref: '#/components/schemas/ReglaMensaje' }
    RegistrarEnvioRequest:
      type: object
      description: Cuerpo opcional; también se acepta sin cuerpo o `{}`.
      properties:
        fecha_envio:
          type: string
          format: date
          nullable: true
          example: '2026-10-01'
          description: Fecha en que se cargó el archivo en el portal de TransUnion. No puede ser futura ni anterior a la fecha de corte. Si falta o es `null`, se usa la fecha de hoy (hora de Bogotá).
    CodigoEdadMora:
      type: string
      enum: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14']
      example: '01'
      description: |
        Código de edad de mora según la Tabla 9 del Manual Sector Real v34 de TransUnion
        (verificada). **El backend devuelve solo el código** (texto de dos dígitos); el frontend lo
        traduce a la descripción. Códigos: `00` Normal (0–29 días), `01` Mora 30 (30–59), `02` Mora
        60 (60–89), `03` Mora 90 (90–119), `04` Mora 120, `05` Mora 150, `06` Mora 180, `07` Mora
        210, `08` Mora 240, `09` Mora 270, `10` Mora 300, `11` Mora 330, `12` Mora 360 (360–539),
        `13` Mora 540 (540–729) y `14` Mora 730 (730 días o más).

        | Código | Descripción | Código | Descripción |
        |---|---|---|---|
        | `00` | Normal | `08` | Mora 240 |
        | `01` | Mora 30 | `09` | Mora 270 |
        | `02` | Mora 60 | `10` | Mora 300 |
        | `03` | Mora 90 | `11` | Mora 330 |
        | `04` | Mora 120 | `12` | Mora 360 |
        | `05` | Mora 150 | `13` | Mora 540 |
        | `06` | Mora 180 | `14` | Mora 730 |
        | `07` | Mora 210 | | |

        El backend aún no valida que el valor esté entre `00` y `14` (diferencia R del README). Todo
        campo `edad_mora` de la API usa este mismo esquema. Una obligación Saldada (`02`) lleva
        siempre `00`.
    TipoIdentificacion:
      type: string
      enum: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '12', '13']
      example: '01'
      description: |
        Tipo de identificación del titular según la **Tabla 2** del Manual Sector Real v34 de
        TransUnion: código numérico de dos dígitos, no letras. No existe el código `11`.

        | Código | Descripción | Código | Descripción |
        |---|---|---|---|
        | `01` | Cédula de ciudadanía | `07` | Sociedad extranjera sin NIT en Colombia |
        | `02` | NIT | `08` | Fideicomiso |
        | `03` | Cédula de extranjería | `09` | Registro civil |
        | `04` | Tarjeta de identidad | `10` | Carnet diplomático |
        | `05` | Pasaporte | `12` | PEP |
        | `06` | Tarjeta del seguro social extranjero | `13` | PPT |

        **Diferencia con el backend:** su `docs/API.md` ya muestra `"01"`,
        pero el código copia el valor de la base sin validarlo (`DISCREPANCIAS.md`, A3). El contrato
        sigue al manual; el backend debe devolver estos códigos.
    EstadoObligacion:
      type: string
      enum: ['01', '02', '03', '04', '06', '07', '08', '10', '11', '12']
      example: '01'
      description: |
        Estado de la obligación ante TransUnion según la **Tabla 4b** del Manual Sector Real v34
        (**Sector Real Servicios**, paquete SSR), sector con el que reporta CENS (decisión de Johan,
        10/10/2026). No existen los códigos `05` ni `09`.

        | Código | Descripción |
        |---|---|
        | `01` | Vigente |
        | `02` | Saldada |
        | `03` | Dudoso recaudo |
        | `04` | Suspendida por la entidad |
        | `06` | Castigada |
        | `07` | Castigada recuperada (cartera recuperada) |
        | `08` | Inactivo |
        | `10` | Ley 550 |
        | `11` | Ley 1116 |
        | `12` | Ley 1564 de 2012 (insolvencia de persona natural no comerciante) |

        **El sector importa:** la Tabla 4a (Comercio) usa los mismos códigos con otros significados;
        por ejemplo, `03` y `04` no son Dudoso recaudo ni Suspendida por la entidad en Comercio.

        **Saldada (`02`)** exige `valor_saldo` 0, `valor_mora` 0, `edad_mora` `'00'`, `valor_cuota` 0
        y `cuotas_mora` 0. El backend todavía no declara la tabla ni valida los códigos
        (`DISCREPANCIAS.md`, A4).
    NumeroObligacion:
      type: string
      maxLength: 20
      pattern: '^[A-Za-z0-9()*,\-./\\_]{1,20}$'
      example: 2257-4156
      description: |
        Número que identifica la obligación ante TransUnion: **único, permanente** y de **máximo 20
        caracteres** (Manual v34). Solo admite letras, números y los especiales `( ) * , - . / \ _`.
        Se deriva del número de proceso de la financiación y **no puede cambiar de un mes a otro**:
        si cambiara hay que renumerar (registro tipo 3) o TransUnion lo toma como obligación nueva.
    NumeroIdentificacion:
      type: string
      example: '******0001'
      description: |
        **Dato personal reservado.** Llega **enmascarado**: seis asteriscos y los últimos 4 dígitos
        (`******0001`); con menos de 4 caracteres, todo en asteriscos, y sin valor, `****`.
        Implementado en el backend. El frontend lo vuelve a
        enmascarar en pantalla y no lo registra completo en el log. Falta decidir si algún rol puede
        verlo completo (pendiente anotado en el backend).
    ObligacionCorte:
      type: object
      required: [numero_obligacion, nombre_titular, numero_identificacion, estado_tu, edad_mora, dias_mora, cuotas_mora, valor_mora, valor_saldo, n_creditos]
      description: |
        Una **obligación = una financiación (proceso)**. Un mismo deudor puede tener varias, y una
        misma obligación puede tener varios titulares; el corte muestra un titular por fila. Puede
        ser una obligación **saldada** desde el corte anterior: `estado_tu` `02`, `valor_saldo`,
        `valor_mora`, `cuotas_mora` en `0` y `edad_mora` `'00'` (contrato 0.4; el backend hoy las
        excluye, `DISCREPANCIAS.md` A2).
      properties:
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_titular: { type: string, example: TITULAR FICTICIO UNO }
        numero_identificacion: { $ref: '#/components/schemas/NumeroIdentificacion' }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
        edad_mora: { $ref: '#/components/schemas/CodigoEdadMora' }
        dias_mora: { type: integer, minimum: 0, example: 0, description: Fecha de corte menos fecha límite de pago (RF7). }
        cuotas_mora: { type: integer, minimum: 0, example: 0 }
        valor_mora: { type: integer, example: 0, description: Valor vencido en COP. Cero si no hay mora. }
        valor_saldo: { type: integer, example: 500000, description: "Saldo neto en COP (RF4). El archivo de TransUnion lo exige en miles de pesos; esa conversión la hace el generador (Iteración 2), no la API." }
        n_creditos: { type: integer, minimum: 0, example: 1, description: Cantidad de créditos que componen la obligación. }

    # ── Historial ──
    ReporteEnviado:
      type: object
      required: [id, fecha_corte, fecha_envio, total_registros, saldo_consolidado, grupo, observacion]
      description: Un corte enviado (`ENVIADO` o, desde la 0.9, `ENVIADO_CON_INCONSISTENCIAS`). El `id` es el del corte.
      properties:
        id: { type: integer, example: 1 }
        fecha_corte: { type: string, format: date, example: '2026-09-30' }
        fecha_envio: { type: string, format: date, example: '2026-10-01', description: "Fecha registrada en `registrar-envio`." }
        total_registros: { type: integer, example: 150 }
        saldo_consolidado: { type: integer, example: 45000000, description: Suma del saldo del corte en COP. }
        grupo: { type: string, nullable: true, example: Grupo ficticio A, description: "Nombre del grupo de conceptos (solo el nombre, no un objeto). `null` si se usaron todos los conceptos reportables." }
        observacion: { type: string, nullable: true, description: "Observación del envío. Ninguna operación de la API la escribe todavía, así que llega `null`." }
    ReporteDetalleFila:
      type: object
      required: [numero_obligacion, nombre_titular, numero_identificacion, tipo_id_tu, tipo_cartera, estado_tu, edad_mora, fecha_inicio, cuotas_mora, valor_inicial, valor_mora, valor_saldo, valor_cuota, dias_mora, origen_dias_mora, n_creditos, fecha_ultimo_pago]
      description: |
        Una fila de lo enviado en un corte. Reúne parte de los 22 campos que pidió CENS
        (`campos tranusnion.xlsx`); correo y celular no se exponen en la API.
      properties:
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_titular: { type: string, example: TITULAR FICTICIO UNO }
        numero_identificacion: { $ref: '#/components/schemas/NumeroIdentificacion' }
        tipo_id_tu: { $ref: '#/components/schemas/TipoIdentificacion' }
        tipo_cartera: { type: integer, example: 2, description: Tipo de cartera (código numérico; catálogo por confirmar). }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
        edad_mora: { $ref: '#/components/schemas/CodigoEdadMora' }
        fecha_inicio: { type: string, format: date, nullable: true, example: '2025-01-01', description: Fecha de inicio de la financiación. }
        cuotas_mora: { type: integer, minimum: 0, example: 0 }
        valor_inicial: { type: integer, nullable: true, example: 500000, description: Valor inicial de la financiación en COP. }
        valor_mora: { type: integer, example: 0, description: Valor vencido en COP. Cero si no hay mora. }
        valor_saldo: { type: integer, example: 500000, description: Saldo neto en COP. }
        valor_cuota: { type: integer, nullable: true, example: 50000, description: Valor de la cuota en COP. }
        dias_mora: { type: integer, minimum: 0, example: 0 }
        origen_dias_mora: { type: string, example: SIN_MORA, description: De dónde se calculó `dias_mora` (por ejemplo `SIN_MORA`). Conjunto de valores por confirmar con José Luis. }
        n_creditos: { type: integer, minimum: 0, example: 1 }
        fecha_ultimo_pago: { type: string, format: date, nullable: true, description: Fecha del último pago. `null` si no tiene pagos. }
    DeudorBusqueda:
      type: object
      required: [obligacion_id, numero_obligacion, cliente_id, numero_proceso, fecha_inicio, ultimo_estado_tu, ultimo_valor_saldo]
      description: Una obligación encontrada en la búsqueda del historial de deudores.
      properties:
        obligacion_id: { type: integer, example: 1, description: "Id interno; se usa en `GET /historial/deudores/{id}/`." }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        cliente_id: { type: integer, example: 900001, description: Id del cliente en el sistema comercial de CENS. }
        numero_proceso: { type: integer, example: 1001, description: Número del proceso de financiación. }
        fecha_inicio: { type: string, format: date, nullable: true, example: '2025-01-01' }
        ultimo_estado_tu:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EstadoObligacion'
          description: "Estado en el último corte no anulado donde aparece. `null` si nunca ha aparecido en un corte. Ese último corte todavía puede ser un `BORRADOR` (diferencia Z del README)."
        ultimo_valor_saldo: { type: integer, nullable: true, example: 500000, description: Saldo en COP en ese último corte. `null` si nunca ha aparecido en un corte. }
    DeudorLineaTiempo:
      type: object
      required: [fecha_corte, estado_tu, edad_mora, dias_mora, cuotas_mora, valor_mora, valor_saldo, estado_corte]
      description: El estado de una obligación en un corte.
      properties:
        fecha_corte: { type: string, format: date, example: '2026-09-30' }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
        edad_mora: { $ref: '#/components/schemas/CodigoEdadMora' }
        dias_mora: { type: integer, minimum: 0, example: 0 }
        cuotas_mora: { type: integer, minimum: 0, example: 0 }
        valor_mora: { type: integer, example: 0, description: Valor vencido en COP. }
        valor_saldo: { type: integer, example: 500000, description: Saldo neto en COP. }
        estado_corte: { $ref: '#/components/schemas/EstadoCorte' }

    # ── Auditoría ──
    Modulo:
      type: string
      enum: [Seguridad, Usuarios, Parametrización, Extracción]
    TipoAccion:
      type: string
      description: |
        Clasificación estable de la acción. Une las dos listas de CENS: RF30 (consulta, generación de
        archivo, corrección, eliminación) y el Acta 3 (consulta, **cálculo, exportación y
        modificación**), más los eventos de seguridad y administración de la maqueta.
        `calculo` = ejecutar una extracción o consolidación; `exportacion` = exportar un archivo o
        reporte; `generacion` = generar el archivo plano de TransUnion; `modificacion` = cambiar
        datos de cartera; `correccion` = corregir información ya reportada.
      enum: [inicio_sesion, cierre_sesion, consulta, calculo, generacion, exportacion, modificacion, correccion, eliminacion, creacion, edicion, desactivacion]
    RegistroAuditoria:
      type: object
      required: [id, fecha_hora, usuario_id, usuario, rol, accion, tipo_accion, modulo, detalle]
      properties:
        id: { type: integer }
        fecha_hora: { type: string, format: date-time, example: '2026-10-12T08:30:00-05:00' }
        usuario_id:
          type: integer
          nullable: true
          example: 2
          description: Id del usuario que realizó la acción; `null` en las acciones del sistema.
        usuario:
          type: string
          example: Rosa Martínez
          description: Nombre para mostrar, guardado al momento de la acción (no cambia si después se edita el usuario). `Sistema` cuando no hubo usuario.
        rol:
          type: string
          enum: [ANALISTA_CARTERA, ADMINISTRADOR, null]
          nullable: true
          description: Código de `Rol` al momento de la acción; `null` en las acciones del sistema.
        accion: { type: string, example: Usuario desactivado, description: Texto legible en español (lista en `GET /auditoria/`). }
        tipo_accion: { $ref: '#/components/schemas/TipoAccion' }
        modulo: { $ref: '#/components/schemas/Modulo' }
        detalle:
          type: string
          example: "Usuario jperez@example.com actualizado: ['is_active']"
          description: |
            Sin contraseñas, tokens ni datos personales de deudores; `""` si no hay. Ejemplos del
            backend: `Acceso correcto`, `Cierre manual`, `Cierre por inactividad` (0.7),
            `Campos: descripcion, activo`,
            `Fecha de corte 2026-08-31`. En usuarios incluye el correo del usuario afectado y los
            nombres de los campos que cambiaron (diferencia AE del README).

    # ═════════════════════════ Iteración 2 (contrato 0.9, propuesta) ═════════════════════════
    # ── Comunes ──
    Pesos:
      type: integer
      minimum: 0
      description: Valor en pesos colombianos (COP), sin decimales. La conversión a miles de pesos (RF51) la hace el generador del archivo, no la API.
    EstadoObligacionONulo:
      type: string
      nullable: true
      enum: ['01', '02', '03', '04', '06', '07', '08', '10', '11', '12', null]
      description: Como `EstadoObligacion`, o `null` (por ejemplo, el estado anterior en un primer reporte). Repite su enum porque Redocly no acepta `null` dentro de un `allOf`; una prueba de `contrato.test.js` vigila que sigan iguales.
    CodigoEdadMoraONulo:
      type: string
      nullable: true
      enum: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14', null]
      description: Como `CodigoEdadMora`, o `null`. Repite su enum (ver `EstadoObligacionONulo`).
    CodigoDescripcionONulo:
      type: object
      nullable: true
      required: [codigo, descripcion]
      description: Como `CodigoDescripcion`, o `null` si falta el dato.
      properties:
        codigo: { type: string }
        descripcion: { type: string }
    ItemCatalogoONulo:
      type: object
      nullable: true
      required: [codigo, descripcion, confirmado]
      description: Como `ItemCatalogo`, o `null`. En una novedad, el motivo de eliminación (Tabla 28) solo va en las eliminaciones.
      properties:
        codigo: { type: string }
        descripcion: { type: string }
        confirmado: { type: boolean }
    CodigoDescripcion:
      type: object
      required: [codigo, descripcion]
      description: Un código de una tabla del Manual con su texto.
      properties:
        codigo: { type: string, example: '01' }
        descripcion: { type: string, example: Voluntario }
    ItemCatalogo:
      type: object
      required: [codigo, descripcion, confirmado]
      description: |
        Un código de un catálogo del Manual (script 10). `confirmado` es `false` mientras CENS o
        TransUnion no lo confirmen: la pantalla lo muestra con la etiqueta «por confirmar». Los
        códigos de los ejemplos de tipologías de reclamo y motivos de eliminación son ilustrativos:
        los oficiales los carga el script 10 desde el Manual v34.
      properties:
        codigo: { type: string, example: '16' }
        descripcion: { type: string, example: Refinanciación }
        confirmado: { type: boolean }
    NombreCatalogo:
      type: string
      enum: [modos-extincion, tipos-pago, naturalezas-reestructuracion, motivos-eliminacion, tipologias-reclamo]
      description: |
        `modos-extincion` (Tabla 10), `tipos-pago` (Tabla 31), `naturalezas-reestructuracion`
        (Tabla 11; código que usará CENS por definir), `motivos-eliminacion` (Tabla 28) y
        `tipologias-reclamo` (Ley 1266 y lista de TransUnion, por confirmar).
    ReglaAplicada:
      type: object
      required: [rf, texto, por_confirmar]
      description: Una regla de negocio aplicada o posible, en texto para mostrar (sin HTML).
      properties:
        rf: { type: string, pattern: '^RF\d{1,2}$', example: RF14 }
        texto: { type: string, example: 'Crédito caducado en el SAC y con mora → 03 · Dudoso Recaudo' }
        por_confirmar: { type: boolean, description: "`true` si la regla depende de una respuesta de CENS o de TransUnion (Anexo A)." }
    ObligacionRef:
      type: object
      nullable: true
      required: [obligacion_id, numero_obligacion]
      properties:
        obligacion_id: { type: integer, example: 11 }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
    ConteoEstado:
      type: object
      required: [estado_tu, cantidad]
      properties:
        estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
        cantidad: { type: integer, minimum: 0 }

    # ── Obligaciones (pantalla 9) ──
    ObligacionResumen:
      type: object
      required: [obligacion_id, numero_obligacion, nombre_titular, numero_identificacion, estado_tu, edad_mora, dias_mora, cuotas_mora, valor_mora, valor_saldo, cerrada, primer_reporte, caducado, en_reclamo, eliminada, requiere_revision]
      description: Una obligación (una financiación) con su estado según el último ciclo mensual.
      properties:
        obligacion_id: { type: integer, example: 7, description: "Id interno; se usa en `GET /obligaciones/{id}/`." }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_titular: { type: string, example: Hotel Mirador Cúcuta }
        numero_identificacion: { $ref: '#/components/schemas/NumeroIdentificacion' }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
        edad_mora: { $ref: '#/components/schemas/CodigoEdadMora' }
        dias_mora: { type: integer, minimum: 0, example: 156, description: Días desde la fecha límite de la cuota vencida más antigua sin pagar completa (RF7). }
        cuotas_mora: { type: integer, minimum: 0, example: 6, description: 'Cuotas facturadas, vencidas y no pagadas completas (RF19).' }
        valor_mora: { $ref: '#/components/schemas/Pesos' }
        valor_saldo: { $ref: '#/components/schemas/Pesos' }
        cerrada: { type: boolean, description: "`true` en Saldada (`02`) y Cartera Recuperada (`07`): se reportan una sola vez (RF13, RF16)." }
        primer_reporte: { type: boolean, description: "`true` si todavía no figura en ningún corte enviado (RF10)." }
        caducado: { type: boolean, description: "Crédito caducado en el SAC: sus atrasos alcanzaron los permitidos (RF14)." }
        en_reclamo: { type: boolean, description: Tiene un reclamo de Habeas Data abierto (RF23). Se sigue reportando. }
        eliminada: { type: boolean, description: Eliminada en TransUnion; no se vuelve a reportar (RF50). }
        requiere_revision: { type: boolean, description: "Marcada para revisión del Analista (RF11, RF14, RF45, RF47); el motivo está en el detalle." }
    Cierre:
      type: object
      nullable: true
      required: [fecha_corte, fecha_pago, modo_extincion, tipo_pago]
      description: Datos de cierre en Saldada o Cartera Recuperada (RF12, RF15, RF22).
      properties:
        fecha_corte: { type: string, format: date, example: '2026-09-30', description: Corte en que se reportó (o se reportará) el cierre. }
        fecha_pago: { type: string, format: date, nullable: true, example: '2026-09-12', description: "`null` si falta: el cierre no se reporta (RF22)." }
        modo_extincion: { $ref: '#/components/schemas/CodigoDescripcionONulo' }
        tipo_pago: { $ref: '#/components/schemas/CodigoDescripcionONulo' }
    PagoMora:
      type: object
      nullable: true
      required: [fecha_pago, modo_extincion, tipo_pago, valor_real_pagado]
      description: Pago de la mora sin cierre (RF47). Modo y tipo por defecto Voluntario (`01`), por confirmar con CENS.
      properties:
        fecha_pago: { type: string, format: date, nullable: true, description: "`null` si no hay fecha: la obligación queda marcada para revisión." }
        modo_extincion: { $ref: '#/components/schemas/CodigoDescripcion' }
        tipo_pago: { $ref: '#/components/schemas/CodigoDescripcion' }
        valor_real_pagado: { $ref: '#/components/schemas/Pesos' }
    Reestructuracion:
      type: object
      nullable: true
      required: [numero_reestructuraciones, naturaleza, obligacion_anterior]
      description: Obligación reestructurada (`01`) por una refinanciación (RF18). Se mantiene en los cortes siguientes.
      properties:
        numero_reestructuraciones: { type: integer, minimum: 1, example: 1 }
        naturaleza: { $ref: '#/components/schemas/ItemCatalogo' }
        obligacion_anterior: { $ref: '#/components/schemas/ObligacionRef', description: La obligación original que se refinanció. }
    CuotaVencida:
      type: object
      required: [fecha_vencimiento, valor_pendiente, dias]
      properties:
        fecha_vencimiento: { type: string, format: date, example: '2026-08-14' }
        valor_pendiente: { $ref: '#/components/schemas/Pesos' }
        dias: { type: integer, minimum: 0, example: 47, description: Días desde el vencimiento hasta la fecha de corte. }
    PagoExtraido:
      type: object
      required: [fecha_corte, valor, aplicado_a, nota]
      description: Un pago que trajo la extracción del SAC (`CLI_PAGOS`). Se aplica de la cuota más antigua a la más reciente (regla de imputación por confirmar, C-29).
      properties:
        fecha_corte: { type: string, format: date, example: '2026-09-30' }
        valor: { $ref: '#/components/schemas/Pesos' }
        aplicado_a: { type: string, example: 'Cuota del 14/08/2026' }
        nota: { type: string, nullable: true }
    ObligacionDetalle:
      description: El detalle de la pantalla 9.
      allOf:
        - $ref: '#/components/schemas/ObligacionResumen'
        - type: object
          required: [motivo_revision, concepto, fecha_ingreso, valor_inicial, valor_cuota, valor_cuota_antes_cierre, fecha_exigibilidad, anios_mora, atrasos_permitidos, cuotas_atrasadas, cierre, pago_mora, reestructuracion, refinanciada_en, movimiento_posterior_cierre, cuotas_vencidas, pagos, posibles_transiciones, advertencias]
          properties:
            motivo_revision: { type: string, nullable: true, example: 'La edad bajó de 02 a 00 sin un abono en el periodo (RF11).' }
            concepto:
              type: object
              required: [codigo, descripcion]
              properties:
                codigo: { type: integer, example: 3625 }
                descripcion: { type: string, nullable: true }
            fecha_ingreso: { type: string, format: date, example: '2026-02-28', description: Fecha del primer corte en que aparece. }
            valor_inicial: { allOf: [{ $ref: '#/components/schemas/Pesos' }], description: "Monto financiado (`DEUDA_INICIAL_CAP`; composición por confirmar, P-CENS-03)." }
            valor_cuota: { allOf: [{ $ref: '#/components/schemas/Pesos' }], description: Cuota periódica; `0` en una obligación cerrada (RF22). }
            valor_cuota_antes_cierre: { type: integer, minimum: 0, nullable: true, description: "Cuota que tenía antes de cerrar («al cerrar se reporta en $0», RF52). `null` si no está cerrada." }
            fecha_exigibilidad: { type: string, format: date, nullable: true, example: '2026-08-14', description: Fecha límite de la cuota impaga más antigua (RF49). `null` si está al día. }
            anios_mora: { type: integer, minimum: 0, nullable: true, example: null, description: Solo con edad `14` (RF49). }
            atrasos_permitidos: { type: integer, minimum: 0, example: 4, description: "Atrasos con los que caduca el crédito en el SAC (`CREDITOS.ATRASOS_PERMITIDOS`, RF14)." }
            cuotas_atrasadas: { type: integer, minimum: 0, example: 2, description: "`CREDITOS.CONTATRASOS`." }
            cierre: { $ref: '#/components/schemas/Cierre' }
            pago_mora: { $ref: '#/components/schemas/PagoMora' }
            reestructuracion: { $ref: '#/components/schemas/Reestructuracion' }
            refinanciada_en: { $ref: '#/components/schemas/ObligacionRef', description: 'La nueva obligación, si esta se cerró por refinanciación (RF18).' }
            movimiento_posterior_cierre: { type: boolean, description: "`true` si el SAC muestra movimiento después del cierre: no se reporta y solo se corrige por rectificación (RF13, RF16, RF55)." }
            cuotas_vencidas:
              type: array
              description: Cuotas vencidas sin pagar completas, de la más antigua a la más reciente (RF17).
              items: { $ref: '#/components/schemas/CuotaVencida' }
            pagos:
              type: array
              description: Pagos de la última extracción.
              items: { $ref: '#/components/schemas/PagoExtraido' }
            posibles_transiciones:
              type: array
              description: «Qué puede pasar con esta obligación», según su estado.
              items: { $ref: '#/components/schemas/ReglaAplicada' }
            advertencias:
              type: array
              description: Alertas informativas de la obligación (por ejemplo, saldo mayor al valor inicial, RF52).
              items: { $ref: '#/components/schemas/ReglaMensaje' }
    ResumenObligaciones:
      type: object
      required: [fecha_ultimo_ciclo, total, abiertas, por_estado, eliminadas, por_cuotas_mora, financiaciones_nuevas]
      properties:
        fecha_ultimo_ciclo: { type: string, format: date, nullable: true, example: '2026-09-30' }
        total: { type: integer, minimum: 0, description: Obligaciones no eliminadas. }
        abiertas: { type: integer, minimum: 0, description: No cerradas ni eliminadas. }
        por_estado: { type: array, items: { $ref: '#/components/schemas/ConteoEstado' } }
        eliminadas: { type: integer, minimum: 0 }
        por_cuotas_mora:
          type: object
          required: [al_dia, una, dos_a_tres, cuatro_o_mas]
          description: Solo obligaciones abiertas; los cuatro grupos suman `abiertas` (RF19).
          properties:
            al_dia: { type: integer, minimum: 0 }
            una: { type: integer, minimum: 0 }
            dos_a_tres: { type: integer, minimum: 0 }
            cuatro_o_mas: { type: integer, minimum: 0 }
        financiaciones_nuevas:
          type: array
          description: Obligaciones del corte en `BORRADOR` que nunca se han reportado (entrarán en primer reporte, RF10).
          items:
            type: object
            required: [numero_obligacion, nombre_titular]
            properties:
              numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
              nombre_titular: { type: string }
    EventoObligacion:
      type: object
      required: [fecha, estado_tu, edad_mora, descripcion]
      properties:
        fecha: { type: string, format: date, example: '2026-09-30' }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
        edad_mora: { $ref: '#/components/schemas/CodigoEdadMora' }
        descripcion: { type: string, example: 'Primer reporte en Vigente (01), al día' }

    # ── Matriz y ciclo mensual (pantalla 10) ──
    TransicionMatriz:
      type: object
      required: [desde, desde_con_mora, hacia, hacia_con_mora, permitida]
      properties:
        desde: { $ref: '#/components/schemas/EstadoObligacion' }
        desde_con_mora: { type: boolean, description: "`false` = sin mora (`n`), `true` = con mora (`m`)." }
        hacia: { $ref: '#/components/schemas/EstadoObligacion' }
        hacia_con_mora: { type: boolean }
        permitida: { type: boolean, description: "`false` = TransUnion lo rechaza con el error 713." }
    MatrizEstados:
      type: object
      required: [tipo_cartera, estados, transiciones]
      properties:
        tipo_cartera: { type: integer, example: 2, description: 2 = Servicios. }
        estados:
          type: array
          description: Orden de las columnas de la matriz del Manual.
          items: { $ref: '#/components/schemas/EstadoObligacion' }
        transiciones:
          type: array
          description: Las 400 combinaciones.
          items: { $ref: '#/components/schemas/TransicionMatriz' }
    CicloCreateRequest:
      type: object
      required: [fecha_corte]
      properties:
        fecha_corte: { type: string, format: date, example: '2026-10-31', description: Último día del mes; debe existir un corte en `BORRADOR` con esta fecha. }
    CicloResumen:
      type: object
      required: [corte_id, fecha_corte, fecha_ejecucion, ejecutada_por, primer_reporte, cambios_estado, cierres, rechazados]
      properties:
        corte_id: { type: integer, example: 2 }
        fecha_corte: { type: string, format: date, example: '2026-09-30' }
        fecha_ejecucion: { type: string, format: date-time, example: '2026-09-30T10:02:00-05:00' }
        ejecutada_por: { type: string, nullable: true, example: Juan Pérez, description: "`null` si lo ejecutó el proceso programado (RF9)." }
        primer_reporte: { type: integer, minimum: 0 }
        cambios_estado: { type: integer, minimum: 0 }
        cierres: { type: integer, minimum: 0, description: Obligaciones que pasaron a 02 o 07. }
        rechazados: { type: integer, minimum: 0, description: 'Cambios rechazados (713 u 881). Bloquean la validación del corte hasta que se corrija el dato en el SAC y se vuelva a ejecutar el ciclo.' }
    Transicion:
      type: object
      required: [obligacion_id, numero_obligacion, nombre_titular, estado_anterior, estado_nuevo, edad_anterior, edad_nueva, primer_reporte, requiere_revision, reglas]
      description: «Qué pasó» con una obligación en el ciclo.
      properties:
        obligacion_id: { type: integer }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_titular: { type: string }
        estado_anterior: { $ref: '#/components/schemas/EstadoObligacionONulo', description: "`null` en primer reporte." }
        estado_nuevo: { $ref: '#/components/schemas/EstadoObligacion' }
        edad_anterior: { $ref: '#/components/schemas/CodigoEdadMoraONulo' }
        edad_nueva: { $ref: '#/components/schemas/CodigoEdadMora' }
        primer_reporte: { type: boolean }
        requiere_revision: { type: boolean, description: 'Salto de más de un tramo o baja de edad sin abono (RF11), caducado o castigo sin mora (RF14, RF45).' }
        reglas: { type: array, items: { $ref: '#/components/schemas/ReglaAplicada' } }
    RechazoCiclo:
      type: object
      required: [obligacion_id, numero_obligacion, nombre_titular, estado_anterior, estado_calculado, codigo, motivo]
      properties:
        obligacion_id: { type: integer }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_titular: { type: string }
        estado_anterior: { $ref: '#/components/schemas/EstadoObligacionONulo', description: "`null` en primer reporte." }
        estado_calculado: { $ref: '#/components/schemas/EstadoObligacion' }
        codigo: { type: string, enum: ['713', '881'], description: "`713` cambio de estado inválido (matriz); `881` estado no permitido en primer reporte." }
        motivo: { type: string, example: 'Error 713: la matriz no permite pasar de Saldada sin mora a Dudoso Recaudo' }
    CicloDetalle:
      allOf:
        - $ref: '#/components/schemas/CicloResumen'
        - type: object
          required: [con_pagos, a_dudoso, a_castigada, normalizadas, transiciones, rechazos]
          properties:
            con_pagos: { type: integer, minimum: 0, description: Obligaciones con pagos aplicados del SAC. }
            a_dudoso: { type: integer, minimum: 0 }
            a_castigada: { type: integer, minimum: 0 }
            normalizadas: { type: integer, minimum: 0, description: Pagaron la mora sin cancelar el saldo y volvieron a 01 (RF46). }
            transiciones: { type: array, items: { $ref: '#/components/schemas/Transicion' } }
            rechazos: { type: array, items: { $ref: '#/components/schemas/RechazoCiclo' } }

    # ── Refinanciaciones (pantalla 11) ──
    Refinanciacion:
      type: object
      required: [id, fecha, fecha_registro, registrada_por, origen, obligacion_original, obligacion_nueva, saldo_refinanciado, naturaleza, numero_cuotas]
      properties:
        id: { type: integer, example: 1 }
        fecha: { type: string, format: date, example: '2026-09-28' }
        fecha_registro: { type: string, format: date-time }
        registrada_por: { type: string, nullable: true, description: "`null` si la detectó la extracción del SAC." }
        origen: { type: string, enum: [SAC, MANUAL] }
        obligacion_original:
          type: object
          required: [obligacion_id, numero_obligacion, nombre_titular, estado_cierre, modo_extincion]
          properties:
            obligacion_id: { type: integer }
            numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
            nombre_titular: { type: string }
            estado_cierre: { type: string, enum: ['02', '07'] }
            modo_extincion: { $ref: '#/components/schemas/CodigoDescripcion' }
        obligacion_nueva:
          type: object
          required: [obligacion_id, numero_obligacion, estado_tu, numero_reestructuraciones]
          properties:
            obligacion_id: { type: integer }
            numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
            estado_tu: { $ref: '#/components/schemas/EstadoObligacion' }
            numero_reestructuraciones: { type: integer, minimum: 1 }
        saldo_refinanciado: { $ref: '#/components/schemas/Pesos' }
        naturaleza: { $ref: '#/components/schemas/ItemCatalogo' }
        numero_cuotas: { type: integer, minimum: 1, maximum: 120 }
    RefinanciacionCreateRequest:
      type: object
      required: [obligacion_original_id, naturaleza, numero_cuotas, fecha]
      properties:
        obligacion_original_id: { type: integer }
        naturaleza: { type: string, description: Código de `GET /catalogos/naturalezas-reestructuracion/`. }
        numero_cuotas: { type: integer, minimum: 1, maximum: 120 }
        fecha: { type: string, format: date, description: No puede ser futura. }

    # ── Estados y homologación (pantalla 16) ──
    EstadoCatalogoTU:
      type: object
      required: [codigo, nombre, usado, es_cierre, confirmado]
      properties:
        codigo: { $ref: '#/components/schemas/EstadoObligacion' }
        nombre: { type: string, example: Vigente }
        usado: { type: boolean, description: "Si CENS usa el estado (`NV_ESTADO_TU.USADO`)." }
        es_cierre: { type: boolean, description: "`true` en 02 y 07." }
        confirmado: { type: boolean }
    HomologacionEstado:
      type: object
      required: [estado_sac, prioridad, descripcion, accion, estado_tu, confirmado, actualizado_por, fecha_actualizacion]
      properties:
        estado_sac: { type: string, pattern: '^[A-Z]$', example: A }
        prioridad: { type: integer, minimum: 1, readOnly: true, description: "0.9.1. Si los créditos de una obligación tienen estados distintos, gana el de menor número (`NV_HOMOLOGA_ESTADO.PRIORIDAD`). Solo lectura." }
        descripcion: { type: string, nullable: true, description: Texto del estado en el SAC (lo carga el script 12; por confirmar con CENS). }
        accion: { type: string, enum: [ESTADO, CIERRE, null], nullable: true, description: "`null` = sin homologar: bloquea la obligación en RF53." }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacionONulo' }
        confirmado: { type: boolean }
        actualizado_por: { type: string, nullable: true }
        fecha_actualizacion: { type: string, format: date-time, nullable: true }
    HomologacionEstadoUpdateRequest:
      type: object
      required: [accion, estado_tu]
      properties:
        accion: { type: string, enum: [ESTADO, CIERRE] }
        estado_tu: { $ref: '#/components/schemas/EstadoObligacionONulo' }
        confirmado: { type: boolean, default: false }

    # ── Reporte a TransUnion (pantalla 12) ──
    NivelValidacion:
      type: string
      enum: [ok, correctiva, advertencia, informativa]
      description: "`correctiva` bloquea (rojo); `advertencia` avisa (amarillo); `informativa` es informativa (azul); `ok` pasó."
    ObligacionReferida:
      type: object
      required: [obligacion_id, numero_obligacion, campo, mensaje]
      properties:
        obligacion_id: { type: integer, nullable: true, description: "`null` si la obligación ya no existe en NexoVolt." }
        numero_obligacion: { type: string, example: 2262-3318 }
        campo: { type: string, nullable: true, example: fecha_pago }
        mensaje: { type: string, example: Falta la fecha de pago del cierre. }
    ResultadoValidacion:
      type: object
      required: [regla, titulo, nivel, detalle, rf, por_confirmar, obligaciones]
      properties:
        regla: { type: string, example: CIERRE_INCOMPLETO, description: Identificador estable de la regla o del grupo de reglas. }
        titulo: { type: string, example: Campos de cierre (RF22) }
        nivel: { $ref: '#/components/schemas/NivelValidacion' }
        detalle: { type: string }
        rf: { type: array, items: { type: string, pattern: '^RF\d{1,2}$' } }
        por_confirmar: { type: boolean }
        obligaciones: { type: array, items: { $ref: '#/components/schemas/ObligacionReferida' } }
    ValidacionesCorte:
      type: object
      required: [corte_id, fecha_corte, estado_corte, puede_generar, resultados]
      properties:
        corte_id: { type: integer }
        fecha_corte: { type: string, format: date }
        estado_corte: { $ref: '#/components/schemas/EstadoCorte' }
        puede_generar: { type: boolean, description: "`false` mientras haya alguna regla `correctiva` o el corte no esté `VALIDADO`." }
        resultados: { type: array, items: { $ref: '#/components/schemas/ResultadoValidacion' } }
    Archivo:
      type: object
      required: [id, corte_id, fecha_corte, nombre, tipo_reporte, fecha_generacion, generado_por, n_registros, total_registros, n_excluidas, saldo_total, longitud_registro_tipo2, apto_envio, motivo_no_apto, enviado, fecha_envio, estado_corte, tiene_resultados]
      description: Un archivo plano generado (`NV_ARCHIVO`).
      properties:
        id: { type: integer }
        corte_id: { type: integer }
        fecha_corte: { type: string, format: date }
        nombre: { type: string, maxLength: 40, example: SSRXXXXXX20260930, description: "`SSR` + tipo de entidad + código de entidad + fecha de corte (RF20, RF57)." }
        tipo_reporte: { type: string, example: '01', description: "`01` = reporte total." }
        fecha_generacion: { type: string, format: date-time }
        generado_por: { type: string, nullable: true }
        n_registros: { type: integer, minimum: 0, description: Registros tipo 2 (uno por obligación y titular). }
        total_registros: { type: integer, minimum: 0, description: Total del registro tipo 9 (incluye el 1 y el 9). }
        n_excluidas: { type: integer, minimum: 0, description: Cerradas en cortes anteriores o eliminadas (no cuentan como omitidas). }
        saldo_total: { $ref: '#/components/schemas/Pesos' }
        longitud_registro_tipo2: { type: integer, example: 930, description: Parámetro por confirmar con TransUnion (930 declarados contra 929 de la suma de campos). }
        apto_envio: { type: boolean, description: "`false` si la entidad lleva marcador (RF57)." }
        motivo_no_apto: { type: string, nullable: true }
        enviado: { type: boolean }
        fecha_envio: { type: string, format: date, nullable: true }
        estado_corte: { $ref: '#/components/schemas/EstadoCorte' }
        tiene_resultados: { type: boolean, description: Si ya se cargaron los archivos de respuesta de TransUnion (RF54). }
    TipoArchivoResultado:
      type: string
      description: Archivos de respuesta del reporte mensual (Manual, p. 43). Desde la 0.9.4 no incluye los de reclamos (Reclamos Batch, p. 57).
      enum: [ESTADISTICOS, CORRECTIVAS, ALERTAS, ESPECIALES, DETALLE_953, NOREP]
    Inconsistencia:
      type: object
      required: [obligacion_id, numero_obligacion, tipo, codigo, descripcion]
      properties:
        obligacion_id: { type: integer, nullable: true, description: "`null` si el número no corresponde a una obligación del corte." }
        numero_obligacion: { type: string }
        tipo: { type: string, enum: [CORRECTIVA, INFORMATIVA, NO_REPORTADA] }
        codigo: { type: string, description: Código que trae el archivo de TransUnion. }
        descripcion: { type: string }
    ResultadosCargue:
      type: object
      required: [archivo_id, corte_id, fecha_corte, fecha_carga, cargado_por, estado_corte, archivos_cargados, recibidos, cargados, con_inconsistencias, no_reportadas, inconsistencias]
      properties:
        archivo_id: { type: integer }
        corte_id: { type: integer }
        fecha_corte: { type: string, format: date }
        fecha_carga: { type: string, format: date-time }
        cargado_por: { type: string, nullable: true }
        estado_corte: { $ref: '#/components/schemas/EstadoCorte' }
        archivos_cargados:
          type: array
          items:
            type: object
            required: [nombre_archivo, tipo_archivo, n_filas]
            properties:
              nombre_archivo: { type: string }
              tipo_archivo: { $ref: '#/components/schemas/TipoArchivoResultado' }
              n_filas: { type: integer, minimum: 0 }
        recibidos: { type: integer, minimum: 0 }
        cargados: { type: integer, minimum: 0 }
        con_inconsistencias: { type: integer, minimum: 0 }
        no_reportadas: { type: integer, minimum: 0, description: Obligaciones marcadas como no reportadas (R). }
        inconsistencias: { type: array, items: { $ref: '#/components/schemas/Inconsistencia' } }

    # ── Reclamos (pantalla 13, propuesta para Omar) ──
    Reclamo:
      type: object
      description: |
        Reclamo de Habeas Data (RF23). La obligación se sigue reportando en el archivo mensual. Ante
        TransUnion, la marca se pide con el proceso «Marcación de obligaciones (Reclamos Batch)»
        (Manual, p. 57).
      required: [id, obligacion_id, numero_obligacion, nombre_titular, tipologia, fecha_radicacion, observacion, estado, marcacion_generada, desmarcacion_generada, fecha_limite_respuesta, vencido, resultado, fecha_cierre, observacion_cierre, registrado_por, fecha_registro]
      properties:
        id: { type: integer }
        obligacion_id: { type: integer }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_titular: { type: string }
        tipologia: { $ref: '#/components/schemas/ItemCatalogo' }
        fecha_radicacion: { type: string, format: date }
        observacion: { type: string, maxLength: 500, nullable: true, description: Lo que dice el titular al radicar. No cambia al cerrar. }
        estado: { type: string, enum: [EN_RECLAMO, CERRADO] }
        marcacion_generada: { type: boolean, description: '0.9.4. Ya salió en un archivo de marcación (`GET /reclamos/insumo/?tipo=marcacion`). No quiere decir que TransUnion lo radicó: eso lo dice su archivo de radicación (Manual, p. 57), que todavía no se carga. Reemplaza a `radicado_en_tu`.' }
        desmarcacion_generada: { type: boolean, description: '0.9.4. Ya salió en un archivo de desmarcación (`tipo=desmarcacion`). Solo puede ser `true` en un reclamo `CERRADO`.' }
        fecha_limite_respuesta: { type: string, format: date, description: '15 días hábiles desde la radicación (prorrogables 8), sin contar fines de semana ni festivos de Colombia. La regla exacta de conteo (desde qué día se cuenta) está por confirmar con jurídica.' }
        vencido: { type: boolean, description: "`true` si sigue `EN_RECLAMO` después de la fecha límite." }
        resultado: { type: string, maxLength: 30, nullable: true }
        fecha_cierre: { type: string, format: date, nullable: true }
        observacion_cierre: { type: string, maxLength: 500, nullable: true, description: 'La respuesta al titular, registrada al cerrar.' }
        registrado_por: { type: string, nullable: true }
        fecha_registro: { type: string, format: date-time }
    ReclamoCreateRequest:
      type: object
      required: [obligacion_id, tipologia, fecha_radicacion]
      properties:
        obligacion_id: { type: integer }
        tipologia: { type: string, description: Código de `GET /catalogos/tipologias-reclamo/`. }
        fecha_radicacion: { type: string, format: date }
        observacion: { type: string, maxLength: 500, nullable: true }
    ReclamoCerrarRequest:
      type: object
      required: [resultado, fecha_cierre]
      properties:
        resultado: { type: string, maxLength: 30 }
        fecha_cierre: { type: string, format: date }
        observacion_cierre: { type: string, maxLength: 500, nullable: true }

    # ── Novedades, eliminaciones y rectificaciones (pantalla 14, propuesta para Angel) ──
    TipoNovedad:
      type: string
      enum: [INCLUSION, ACTUALIZACION, CORRECCION, ELIMINACION]
    EstadoNovedad:
      type: string
      enum: [PENDIENTE, GESTIONADA, RECHAZADA]
    Novedad:
      type: object
      required: [id, tipo, sujeto, obligacion_id, referencia, motivo, motivo_eliminacion, valores_enviados, fecha_deteccion, origen, estado, numero_transaccion_tu, fecha_gestion, motivo_rechazo, registrada_por]
      properties:
        id: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoNovedad' }
        sujeto: { type: string, enum: [OBLIGACION, TITULAR] }
        obligacion_id: { type: integer, nullable: true, description: "`null` en inclusiones." }
        referencia: { type: string, maxLength: 40 }
        motivo: { type: string, maxLength: 500 }
        motivo_eliminacion: { $ref: '#/components/schemas/ItemCatalogoONulo' }
        valores_enviados: { type: string, maxLength: 1000, nullable: true }
        fecha_deteccion: { type: string, format: date }
        origen: { type: string, enum: [MANUAL, AUTOMATICA] }
        estado: { $ref: '#/components/schemas/EstadoNovedad' }
        numero_transaccion_tu: { type: string, maxLength: 30, nullable: true }
        fecha_gestion: { type: string, format: date, nullable: true }
        motivo_rechazo: { type: string, maxLength: 300, nullable: true }
        registrada_por: { type: string, nullable: true }
    NovedadCreateRequest:
      type: object
      required: [tipo, sujeto, referencia, motivo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoNovedad' }
        sujeto: { type: string, enum: [OBLIGACION, TITULAR] }
        obligacion_id: { type: integer, nullable: true }
        referencia: { type: string, maxLength: 40 }
        motivo: { type: string, maxLength: 500 }
        motivo_eliminacion: { type: string, nullable: true, description: Código de `GET /catalogos/motivos-eliminacion/`; obligatorio si `tipo` es `ELIMINACION`. }
        valores_enviados: { type: string, maxLength: 1000, nullable: true }
    NovedadGestionarRequest:
      type: object
      required: [numero_transaccion_tu, fecha_gestion]
      properties:
        numero_transaccion_tu: { type: string, maxLength: 30 }
        fecha_gestion: { type: string, format: date }
    NovedadRechazarRequest:
      type: object
      required: [motivo_rechazo]
      properties:
        motivo_rechazo: { type: string, maxLength: 300 }
    Eliminacion:
      type: object
      required: [id, obligacion_id, numero_obligacion, fecha, motivo, numero_transaccion_tu, bloqueada, fecha_activacion, numero_activacion_tu]
      properties:
        id: { type: integer }
        obligacion_id: { type: integer, nullable: true }
        numero_obligacion: { type: string }
        fecha: { type: string, format: date }
        motivo: { $ref: '#/components/schemas/ItemCatalogo' }
        numero_transaccion_tu: { type: string, nullable: true }
        bloqueada: { type: boolean, description: "`true` mientras no se registre la activación hecha con TransUnion." }
        fecha_activacion: { type: string, format: date, nullable: true }
        numero_activacion_tu: { type: string, nullable: true }
    EliminacionReactivarRequest:
      type: object
      required: [numero_activacion_tu, fecha_activacion]
      properties:
        numero_activacion_tu: { type: string, maxLength: 30 }
        fecha_activacion: { type: string, format: date }
    Rectificacion:
      type: object
      required: [id, novedad_id, obligacion_id, numero_obligacion, corte_id, fecha_corte, campo, valor_anterior, valor_corregido, justificacion, medio, estado, confirmacion_tu, registrada_por, fecha_registro]
      properties:
        id: { type: integer }
        novedad_id: { type: integer, nullable: true }
        obligacion_id: { type: integer }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        corte_id: { type: integer }
        fecha_corte: { type: string, format: date }
        campo: { type: string, maxLength: 40 }
        valor_anterior: { type: string, maxLength: 100, nullable: true }
        valor_corregido: { type: string, maxLength: 100 }
        justificacion: { type: string, maxLength: 500 }
        medio: { type: string, enum: [ACTUALIZACION_LINEA, PROCESO_ESPECIAL] }
        estado: { type: string, enum: [REGISTRADA, CONFIRMADA] }
        confirmacion_tu: { type: string, nullable: true }
        registrada_por: { type: string, nullable: true }
        fecha_registro: { type: string, format: date-time }
        insumo:
          type: string
          description: '0.9.5. Solo en la respuesta de `POST /rectificaciones/`: una línea `numero_obligacion|campo|valor_corregido` con CRLF final. Formato **por confirmar con TransUnion** (Manual, p. 57, «Novedades Batch»).'
    RectificacionCreateRequest:
      type: object
      required: [obligacion_id, corte_id, campo, valor_corregido, justificacion, medio]
      properties:
        novedad_id: { type: integer, nullable: true, description: '0.9.2. Novedad `CORRECCION` que origina la rectificación (RF24, RF55).' }
        obligacion_id: { type: integer }
        corte_id: { type: integer }
        campo: { type: string, maxLength: 40 }
        valor_corregido: { type: string, maxLength: 100 }
        justificacion: { type: string, maxLength: 500 }
        medio: { type: string, enum: [ACTUALIZACION_LINEA, PROCESO_ESPECIAL] }
    RectificacionConfirmarRequest:
      type: object
      required: [confirmacion_tu]
      properties:
        confirmacion_tu: { type: string, maxLength: 30 }

    # ── Entidad (pantalla 15) y panel (pantalla 4) ──
    Entidad:
      type: object
      required: [tipo_entidad, codigo_entidad, codigo_sucursal, con_marcador, prefijo_archivo, actualizado_por, fecha_actualizacion]
      properties:
        tipo_entidad: { type: string, pattern: '^(\d{3}|XXX)$', example: XXX, description: 'Tres dígitos (Tabla 29) o el marcador. Si TransUnion exige un valor numérico en el registro tipo 1, el marcador sería `000` (por confirmar).' }
        codigo_entidad: { type: string, pattern: '^(\d{3}|XXX)$', example: XXX, description: Tres dígitos (Tabla 30) o el marcador. }
        codigo_sucursal: { type: string, pattern: '^[A-Z0-9]{6}$', example: XXXXXX, description: Seis caracteres; debe existir en TransUnion. Regla para varias sucursales por definir. }
        con_marcador: { type: boolean, description: "`true` si alguno de los tres conserva el marcador: los archivos salen no aptos para envío." }
        prefijo_archivo: { type: string, example: SSRXXXXXX, description: "`SSR` + tipo + código; el nombre del archivo agrega la fecha de corte." }
        actualizado_por: { type: string, nullable: true }
        fecha_actualizacion: { type: string, format: date-time, nullable: true }
    EntidadUpdateRequest:
      type: object
      required: [tipo_entidad, codigo_entidad, codigo_sucursal]
      properties:
        tipo_entidad: { type: string, pattern: '^(\d{3}|XXX)$' }
        codigo_entidad: { type: string, pattern: '^(\d{3}|XXX)$' }
        codigo_sucursal: { type: string, pattern: '^[A-Z0-9]{6}$' }
    PanelResumen:
      type: object
      required: [fecha_ultimo_ciclo, total_obligaciones, distribucion, ultimo_archivo, en_reclamo, novedades_pendientes, con_dos_o_mas_cuotas, entidad_con_marcador]
      properties:
        fecha_ultimo_ciclo: { type: string, format: date, nullable: true }
        total_obligaciones: { type: integer, minimum: 0 }
        distribucion: { type: array, items: { $ref: '#/components/schemas/ConteoEstado' } }
        ultimo_archivo: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Archivo' }] }
        en_reclamo: { type: integer, minimum: 0 }
        novedades_pendientes: { type: integer, minimum: 0 }
        con_dos_o_mas_cuotas: { type: integer, minimum: 0, description: Obligaciones abiertas con 2 o más cuotas en mora (RF19). }
        entidad_con_marcador: { type: boolean }
