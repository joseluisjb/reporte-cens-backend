              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Reclamo no encontrado.' }
        '409':
          description: El reclamo ya está cerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El reclamo ya está cerrado.' }

  /reclamos/insumo/:
    get:
      tags: [Reclamos]
      summary: Insumo para la marcación o desmarcación batch de TransUnion (RF23)
      description: |
        Archivo para el proceso «Marcación de obligaciones (Reclamos Batch)» de TransUnion (Manual,
        p. 57): un proceso masivo para marcar o desmarcar obligaciones según las tipologías de reclamo
        de la Ley de Habeas Data. Se sube por stransfer con el perfil de marcación de obligaciones.

        - `tipo=marcacion`: los reclamos `EN_RECLAMO` con `marcacion_generada: false`.
        - `tipo=desmarcacion`: los reclamos `CERRADO` con `desmarcacion_generada: false`.

        **Cambia el estado (0.9.4):** los reclamos incluidos quedan con `marcacion_generada` o
        `desmarcacion_generada` en `true`, así que una segunda llamada ya no los trae. Generar el
        archivo **no** quiere decir que TransUnion lo aplicó: según el Manual, TransUnion devuelve un
        archivo de radicación (las marcaciones efectivas), uno de cierre (las desmarcadas) y uno de
        inconsistencias. Cargar esos archivos no tiene endpoint todavía.

        El Manual describe el proceso pero **no la estructura del archivo**: la del ejemplo
        (`número|tipología|fecha`) está **por confirmar con TransUnion**. *Propuesta; pantalla de Omar.*
      operationId: reclamosInsumo
      x-roles: [Analista de Cartera]
      parameters:
        - name: tipo
          in: query
          required: true
          schema: { type: string, enum: [marcacion, desmarcacion] }
      responses:
        '200':
          description: El insumo.
          content:
            text/plain:
              schema: { type: string, format: binary }
              example: "2260-5543|02|20260922\r\n"
        '400':
          description: Tipo inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { tipo: ['Usa marcacion o desmarcacion.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Otro usuario cambió los reclamos mientras se generaba el archivo (0.9.4). Se puede reintentar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El insumo cambió mientras se generaba. Intenta de nuevo.' }

