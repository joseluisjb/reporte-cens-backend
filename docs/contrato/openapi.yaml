                naturaleza:
                  summary: Naturaleza que no está en el catálogo
                  value: { naturaleza: ['Selecciona la naturaleza de la reestructuración.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La obligación original no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Obligación no encontrada.' }
        '409':
          description: La matriz no permite cerrar la obligación original, o ya está cerrada o eliminada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                matriz:
                  summary: Origen en Suspendida o en un estado de ley
                  value: { detail: 'TransUnion no acepta pasar de 04 · Suspendida a 02 · Saldada (error 713). Define el tratamiento con CENS.', code: transicion_no_permitida }
                cerrada:
                  summary: Obligación ya cerrada
                  value: { detail: 'La obligación 2259-1092 ya está cerrada: no se puede refinanciar.', code: obligacion_cerrada }

  # ───────────────────────── Catálogos del Manual ─────────────────────────
  /catalogos/{nombre}/:
    get:
      tags: [Catálogos]
      summary: Catálogo del Manual de TransUnion (RF18, RF23, RF24, RF47, RF50)
      description: |
        Códigos de las tablas del Manual Sector Real v34 cargados en la base (script 10). Cada código
        trae `confirmado`: `false` mientras CENS o TransUnion no lo confirmen (la pantalla lo muestra
        como «por confirmar»). Lectura para ambos roles. *Propuesta.*
      operationId: catalogosRead
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: nombre
          in: path
          required: true
          schema: { $ref: '#/components/schemas/NombreCatalogo' }
      responses:
        '200':
          description: Códigos del catálogo, ordenados por código.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemCatalogo' }
              example:
                - { codigo: '01', descripcion: Voluntario, confirmado: true }
                - { codigo: '16', descripcion: Refinanciación, confirmado: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El catálogo no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Catálogo no encontrado.' }

  # ───────────────────────── Estados y homologación (pantalla 16, Administrador) ─────────────────────────
  /estados/:
    get:
      tags: [Estados y homologación]
      summary: Catálogo de los 10 estados de la Tabla 4b (RF48)
      description: |
        Los estados de Sector Real Servicios (`NV_ESTADO_TU`, tipo de cartera 2) con su uso en
        CENS: `01`, `02`, `03`, `06` y `07` se usan; `08` no se usa (Acta 3); `04` propuesta: no se
        usa; `10`, `11` y `12` solo si el cliente está admitido en el proceso de ley (fuente del dato
        por confirmar). *Propuesta.*
      operationId: estadosList
      x-roles: [Administrador]
      responses:
        '200':
          description: Los 10 estados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoCatalogoTU' }
              example:
                - { codigo: '01', nombre: Vigente, usado: true, es_cierre: false, confirmado: true }
                - { codigo: '04', nombre: Suspendida por la entidad, usado: false, es_cierre: false, confirmado: false }
                - { codigo: '08', nombre: Inactivo, usado: false, es_cierre: false, confirmado: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /homologacion-estados/:
    get:
      tags: [Estados y homologación]
      summary: Homologación de los estados del SAC (RF48)
      description: |
        Cada estado del crédito en el sistema comercial de CENS y su equivalente en TransUnion
        (`NV_HOMOLOGA_ESTADO`). `accion` `ESTADO` asigna `estado_tu`; `CIERRE` significa que el
        crédito se cierra (RF12 o RF15) y `estado_tu` va `null`. Un estado con `accion` `null` está
        **sin homologar**: sus obligaciones se bloquean en la validación del corte (RF53). B y D están
        pendientes de CENS (C-11, C-54). `prioridad` (`NV_HOMOLOGA_ESTADO.PRIORIDAD`) decide el estado de
        una obligación cuyos créditos tienen estados distintos: gana el de menor número. Viene de la carga
        inicial (script 12) y es de solo lectura. Ordenado por `prioridad`. *Propuesta (0.9.1).*
      operationId: homologacionEstadosList
      x-roles: [Administrador]
      responses:
        '200':
          description: Homologación vigente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HomologacionEstado' }
              example:
                - { estado_sac: A, prioridad: 1, descripcion: Activo (propuesto), accion: ESTADO, estado_tu: '01', confirmado: false, actualizado_por: null, fecha_actualizacion: null }
                - { estado_sac: C, prioridad: 2, descripcion: Caducado (propuesto), accion: ESTADO, estado_tu: '03', confirmado: false, actualizado_por: null, fecha_actualizacion: null }
                - { estado_sac: D, prioridad: 3, descripcion: 'Desconocido: preguntar a CENS', accion: null, estado_tu: null, confirmado: false, actualizado_por: null, fecha_actualizacion: null }
                - { estado_sac: B, prioridad: 4, descripcion: 'Desconocido: preguntar a CENS', accion: null, estado_tu: null, confirmado: false, actualizado_por: null, fecha_actualizacion: null }
                - { estado_sac: F, prioridad: 5, descripcion: Finalizado (propuesto), accion: CIERRE, estado_tu: null, confirmado: false, actualizado_por: null, fecha_actualizacion: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /homologacion-estados/{estado_sac}/:
    put:
      tags: [Estados y homologación]
      summary: Actualizar la homologación de un estado del SAC (RF48)
      description: |
        Reemplaza la homologación de un estado del SAC. Con `accion` `ESTADO`, `estado_tu` es
        obligatorio, debe ser un estado **en uso** (`usado: true` en `GET /estados/`) y no puede ser de
        cierre (02 o 07): a esos se llega con `CIERRE`, que según el estado anterior da 02 o 07 (RF12,
        RF15; `NV_ESTADO_TU.CIERRE_AL_PAGAR`). Con `CIERRE`, `estado_tu` debe ir `null`. `prioridad` no se
        cambia aquí. Queda registrado quién y cuándo lo cambió, y en la bitácora. *Propuesta (0.9.1).*
      operationId: homologacionEstadosUpdate
      x-roles: [Administrador]
      parameters:
        - name: estado_sac
          in: path
          required: true
          description: Código del estado en el SAC (una letra).
          schema: { type: string, pattern: '^[A-Z]$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomologacionEstadoUpdateRequest' }
            example: { accion: ESTADO, estado_tu: '01', confirmado: true }
      responses:
        '200':
          description: Homologación actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomologacionEstado' }
              example: { estado_sac: A, prioridad: 1, descripcion: Activo (propuesto), accion: ESTADO, estado_tu: '01', confirmado: true, actualizado_por: Rosa Martínez, fecha_actualizacion: '2026-11-07T10:30:00-05:00' }
        '400':
          description: Combinación inválida (por campo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              examples:
                no_usado:
                  summary: Estado de TransUnion que CENS no usa
                  value: { estado_tu: ['El estado 08 · Inactivo no se usa en CENS: elige un estado en uso.'] }
                cierre_con_estado:
                  summary: Cierre con estado asignado
                  value: { estado_tu: ['Un estado que cierra el crédito no lleva estado de TransUnion.'] }
                estado_de_cierre:
                  summary: Estado de cierre asignado como estado (0.9.1)
                  value: { estado_tu: ['Saldada (02) y Castigada recuperada (07) se asignan con «Cierre», según el estado anterior.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El estado del SAC no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Estado del SAC no encontrado.' }

  # ═════════════════════════ Iteración 2 · HU-C (generación y transmisión del reporte) ═════════════════════════

  # ───────────────────────── Reporte a TransUnion (pantalla 12) ─────────────────────────
  /extracciones/{id}/validaciones/:
    get:
      tags: [Reporte a TransUnion]
      summary: Validaciones del corte contra el Manual, antes de generar (RF19, RF21, RF22, RF49, RF51, RF53, RF57)
      description: |
        La lista «Validaciones antes de generar» de la pantalla 12. Cada ítem agrupa una regla o un
        conjunto de reglas con su `nivel`: `correctiva` bloquea la validación y la generación (en
        TransUnion sería correctiva), `advertencia` e `informativa` solo avisan, `ok` pasó. Las
        correctivas traen la lista de obligaciones que fallan, con el campo cuando aplica. No
        cambia el corte (solo consulta): `POST /extracciones/{id}/validar/` aplica las mismas reglas
        y pasa el corte a `VALIDADO`. `puede_generar` es `false` mientras haya alguna correctiva.
        *Propuesta.*
      operationId: extraccionesValidaciones
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultado de las validaciones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidacionesCorte' }
              example:
                corte_id: 2
                fecha_corte: '2026-09-30'
                estado_corte: VALIDADO
                puede_generar: true
                resultados:
                  - regla: ACTUALIZACION_MENSUAL
                    titulo: Actualización mensual del corte
                    nivel: ok
                    detalle: Ejecutada el 30/09/2026 por Juan Pérez.
                    rf: [RF10, RF11]
                    por_confirmar: false
                    obligaciones: []
                  - regla: OMISION_VS_ULTIMO_CORTE
                    titulo: Obligaciones del último corte
                    nivel: ok
                    detalle: 8 de 8 obligaciones activas del último corte incluidas.
                    rf: [RF21]
                    por_confirmar: false
                    obligaciones: []
                  - regla: CIERRE_INCOMPLETO
                    titulo: Campos de cierre (RF22)
                    nivel: ok
                    detalle: 2 cierres con saldo, mora y cuota en cero, fecha de pago, modo de extinción y tipo de pago.
                    rf: [RF22]
                    por_confirmar: false
                    obligaciones: []
                  - regla: VALORES_EN_MILES
                    titulo: Valores en miles de pesos (RF51)
                    nivel: informativa
                    detalle: Los valores se reportan en miles de pesos, como enteros. Regla de redondeo por confirmar con TransUnion.
                    rf: [RF51]
                    por_confirmar: true
                    obligaciones: []
                  - regla: ENTIDAD_CON_MARCADOR
                    titulo: Datos de la entidad (RF57)
                    nivel: advertencia
                    detalle: 'Llevan relleno mientras TransUnion no los asigne: el archivo saldrá no apto para envío.'
                    rf: [RF57]
                    por_confirmar: false
                    obligaciones: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }

  /extracciones/{id}/archivo/:
    post:
      tags: [Reporte a TransUnion]
      summary: Generar el archivo plano del reporte total (RF20, RF21, RF51, RF57)
      description: |
        Genera el archivo del corte `VALIDADO` con la estructura del Manual (págs. 44-52): registro
        tipo 1 (29 caracteres), un registro tipo 2 por obligación y titular, y registro tipo 9 (33
        caracteres), en texto plano de longitud fija y codificación Windows-1252. La longitud del
        registro tipo 2 está **por confirmar** con TransUnion (el Manual declara 930 y sus campos suman
        929): el backend la toma de un parámetro y la devuelve en `longitud_registro_tipo2`.

        Incluye las obligaciones abiertas y las que cerraron en este corte; excluye las cerradas en
        cortes anteriores y las eliminadas (RF13, RF16, RF21, RF50). Los valores van en miles de pesos
        (RF51). El nombre es `SSR` + tipo de entidad + código de entidad + fecha de corte. Si la
        entidad lleva marcador (RF57), el archivo **se genera** pero sale con `apto_envio: false`.
        Generar otra vez el archivo de un corte crea una versión nueva. *Propuesta.*
      operationId: extraccionesArchivo
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Archivo generado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Archivo' }
              example:
                id: 2
                corte_id: 2
                fecha_corte: '2026-09-30'
                nombre: SSRXXXXXX20260930
                tipo_reporte: '01'
                fecha_generacion: '2026-10-01T09:20:00-05:00'
                generado_por: Juan Pérez
                n_registros: 11
                total_registros: 13
                n_excluidas: 1
                saldo_total: 21863586
                longitud_registro_tipo2: 930
                apto_envio: false
                motivo_no_apto: 'La entidad tiene datos con relleno (XXX): TransUnion lo rechazaría.'
                enviado: false
                fecha_envio: null
                estado_corte: VALIDADO
                tiene_resultados: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }
        '409':
          description: El corte no está en `VALIDADO`, o un campo no cabe en su posición (no se genera nada).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCorrectivo' }
              examples:
                no_validado:
                  summary: El corte no está validado
                  value: { detail: 'Valida el corte antes de generar el archivo.' }
                campo_largo:
                  summary: Un campo excede su longitud
                  value:
                    detail: 'No se generó el archivo: hay campos que no caben en su posición.'
                    errores:
                      - { regla: CAMPO_EXCEDE_LONGITUD, mensaje: 'El nombre del titular tiene 61 caracteres y el campo admite 60.', obligacion_id: 6, numero_obligacion: 2262-3318, campo: nombre_titular }

  /archivos/:
    get:
      tags: [Reporte a TransUnion]
      summary: Listar los archivos generados (RF20, RF54)
      description: |
        Más reciente primero. Arreglo plano (uno o pocos por mes). En el ejemplo, el archivo del
        31/08/2026 se generó con datos de entidad **de prueba** (`001`, `123`), como en el caso de prueba
        de RF57; los de CENS siguen con marcador hasta que TransUnion los asigne. *Propuesta.*
      operationId: archivosList
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: corte_id
          in: query
          description: Solo los archivos de este corte.
          schema: { type: integer }
      responses:
        '200':
          description: Archivos generados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Archivo' }
              example:
                - id: 2
                  corte_id: 2
                  fecha_corte: '2026-09-30'
                  nombre: SSRXXXXXX20260930
                  tipo_reporte: '01'
                  fecha_generacion: '2026-10-01T09:20:00-05:00'
                  generado_por: Juan Pérez
                  n_registros: 11
                  total_registros: 13
                  n_excluidas: 1
                  saldo_total: 21863586
                  longitud_registro_tipo2: 930
                  apto_envio: false
                  motivo_no_apto: 'La entidad tiene datos con relleno (XXX): TransUnion lo rechazaría.'
                  enviado: false
                  fecha_envio: null
                  estado_corte: VALIDADO
                  tiene_resultados: false
                - id: 1
                  corte_id: 1
                  fecha_corte: '2026-08-31'
                  nombre: SSR00112320260831
                  tipo_reporte: '01'
                  fecha_generacion: '2026-09-01T09:20:00-05:00'
                  generado_por: Carlos Sánchez
                  n_registros: 9
                  total_registros: 11
                  n_excluidas: 0
                  saldo_total: 19844130
                  longitud_registro_tipo2: 930
                  apto_envio: true
                  motivo_no_apto: null
                  enviado: true
                  fecha_envio: '2026-09-02'
                  estado_corte: ENVIADO_CON_INCONSISTENCIAS
                  tiene_resultados: true
        '400':
          description: Filtro inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { corte_id: ['Indica el id numérico del corte.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /archivos/{id}/descarga/:
    get:
      tags: [Reporte a TransUnion]
      summary: Descargar el archivo plano (RF20)
      description: |
        El contenido tal cual se carga en STRANSFER: texto de longitud fija en Windows-1252, con
        `Content-Disposition: attachment; filename="SSR….txt"`. *Propuesta.*
      operationId: archivosDescarga
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: El archivo.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="SSRXXXXXX20260930.txt"'
          content:
            text/plain:
              schema: { type: string, format: binary }
              example: "111XXXXXX          0120260930\r\n2…\r\n9…\r\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El archivo no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Archivo no encontrado.' }

  /archivos/{id}/resultados/:
    get:
      tags: [Reporte a TransUnion]
      summary: Ver los resultados del cargue de TransUnion (RF54)
      description: Lo que se cargó de los archivos de respuesta de TransUnion para este archivo. *Propuesta.*
      operationId: archivosResultadosRead
      x-roles: [Analista de Cartera]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resultados del cargue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadosCargue' }
              example:
                archivo_id: 1
                corte_id: 1
                fecha_corte: '2026-08-31'
                fecha_carga: '2026-09-05T14:00:00-05:00'
                cargado_por: Carlos Sánchez
                estado_corte: ENVIADO_CON_INCONSISTENCIAS
                archivos_cargados:
                  - { nombre_archivo: Detalle_Inco_CSR_001_123_Correctivas_20260831.txt, tipo_archivo: CORRECTIVAS, n_filas: 1 }
                  - { nombre_archivo: norep.001.123.CODIGOPRODUCTO.20260831.0.txt, tipo_archivo: NOREP, n_filas: 1 }
                recibidos: 9
                cargados: 8
                con_inconsistencias: 2
                no_reportadas: 1
                inconsistencias:
                  - { obligacion_id: 2, numero_obligacion: 2258-7731, tipo: CORRECTIVA, codigo: '707', descripcion: 'VALOR DE MORA ES REQUERIDO' }
                  - { obligacion_id: 4, numero_obligacion: 2260-5543, tipo: NO_REPORTADA, codigo: R, descripcion: 'Obligación no reportada' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El archivo no existe o todavía no tiene resultados cargados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Este archivo todavía no tiene resultados cargados.' }
    post:
      tags: [Reporte a TransUnion]
      summary: Cargar los archivos de respuesta de TransUnion (RF54, RF23)
      description: |
        Uno o varios archivos delimitados por pipes que devuelve TransUnion después del cargue:
        estadísticos, detalle de correctivas y de alertas, Especiales, 953_Detalle y no reportados
        (norep). Su estructura exacta sale del Manual v34 (págs. 42-43 y 52-54). **0.9.4:** los archivos
        de radicación y de cierre de reclamos ya no entran aquí: según el Manual (p. 57) los devuelve el
        proceso «Marcación de obligaciones (Reclamos Batch)», que es aparte del reporte mensual y no
        depende del archivo de un corte (ver `GET /reclamos/insumo/`). El sistema asocia cada inconsistencia a la obligación del corte y deja
        el corte en `ENVIADO` o, si hay correctivas, en `ENVIADO_CON_INCONSISTENCIAS`. Si un archivo no
        corresponde al corte o no tiene la estructura esperada responde `422` y **no guarda nada**.
        Solo para archivos ya enviados. *Propuesta.*

        Los archivos se reconocen por el nombre que les da TransUnion (Manual, p. 43), donde `XXX_XXX` son
        el tipo y el código de entidad y `AAAAMMDD` la fecha de corte:
        `Esta_Inco_CSR_XXX_XXX_Correctivas_AAAAMMDD.txt`, `Esta_Inco_CSR_XXX_XXX_Alertas_AAAAMMDD.txt` y
        `est.XXX.XXX.CODIGOPRODUCTO.AAAAMMDD..txt` (estadísticos); `Detalle_Inco_CSR_XXX_XXX_Correctivas_AAAAMMDD.txt`;
        `Detalle_Inco_CSR_XXX_XXX_Alertas_AAAAMMDD.txt`; `Detalle_Inco_CSR_XXX_XXX_Especiales_AAAAMMDD.txt`;
        `953_Detalle_Inco_CSR_XXX_XXX_Alertas_AAAAMMDD.txt`, y `norep.XXX.XXX.CODIGOPRODUCTO.AAAAMMDD.0.txt`.
        El detalle de inconsistencias (pp. 52-53) trae por línea el registro tipo 2 enviado y hasta cinco
        grupos de código, descripción y tipo; como la tabla del Manual salta el campo 7, se exige un mínimo de
        campos y el total queda **por confirmar con TransUnion**; el número de obligación sale de las posiciones
        89 a 108 del registro tipo 2 (Tabla 2). La estructura de los estadísticos no está en el Manual (por
        confirmar). La p. 43 escribe `CSR`, pero en la Tabla 22 la sigla de cartera servicios es `SSR`
        (`CSR` es cartera préstamos): se aceptan las dos hasta que TransUnion confirme.
      operationId: archivosResultadosCreate
      x-roles: [Analista de Cartera]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivos]
              properties:
                archivos:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
      responses:
        '201':
