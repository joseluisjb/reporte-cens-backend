        `NV_TRANSICION_ESTADO` (script 12): 10 estados de origen × 2 (sin mora `n`, con mora `m`) ×
        10 destinos × 2 = **400 transiciones**. Saldada (`02`) y Cartera Recuperada (`07`) no tienen
        ninguna salida permitida. La pantalla muestra solo los 5 estados que usa CENS; el ciclo
        valida contra la matriz completa. La matriz se lee de la base, no se copia al código.
        *Propuesta.*
      operationId: matrizEstados
