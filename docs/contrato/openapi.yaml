openapi: 3.0.3

info:
  title: NexoVolt — API REST (Iteraciones 1 y 2)
  version: 0.9.5-borrador
  description: |
    Contrato entre el frontend (React) y el backend (Django REST Framework) de NexoVolt.
    Cubre la **Iteración 1**: HU-A (extracción, consolidación y trazabilidad) y HU-D (seguridad,
    usuarios y auditoría). RF1–RF9, RF35 y RF25–RF31. Desde la 0.9 cubre también la **Iteración 2**
    (HU-B y HU-C), como propuesta.

    **Estado: BORRADOR para revisión** de José Luis (usuarios, parámetros, extracción, historial) y
    Dilan (autenticación, roles, auditoría, validaciones). La versión 0.2 se alineó con lo ya
    implementado en `reporte-cens-backend` (rama `dev`: conceptos, grupos de conceptos y salud). La
    **versión 0.3 se alinea también con la extracción, el ciclo de corte (validar y registrar el
    envío) y el historial** de `origin/dev` (commit `cf07754`, 10/10/2026). Autenticación, usuarios y
    auditoría siguen siendo lo que construyó el frontend contra mocks o una propuesta para Dilan.
    La **versión 0.4 sigue al Manual Sector Real v34 de TransUnion** en los puntos donde el backend
    se aparta de él (tipo de identificación, estado de la obligación, qué entra al corte y la
    comprobación de la fecha de corte; ver `DISCREPANCIAS.md`, filas A2, A3, A4 y A9). Johan decidió
    el 10/10/2026 que CENS reporta como **Sector Real Servicios** (paquete SSR, Tabla 4b, categoría
    de servicios `04` "Servicio energía"). Donde el backend difiere de lo que pide la
    documentación, el README del contrato lo lista como diferencia por resolver. Cada operación dice si está *implementada en el backend*, *implementada
    en el frontend* (contra mocks) o es *propuesta*.

    La **versión 0.5** recoge los cambios del backend del 10/10/2026, revisados el 11/10/2026 en la
    rama `main` (commit `e835f31`), que ya incluye `fix/api-reglas`. Suma
    `DELETE /extracciones/{id}/`, pagina la búsqueda de deudores y marca como resueltas las
    diferencias que el backend ya corrigió (README y `DISCREPANCIAS.md`).

    La **versión 0.6** confirma la autenticación (RF25–RF27, Dilan), los usuarios y la recuperación
    de contraseña (RF28–RF29, José Luis) y la auditoría (RF30–RF31, Dilan) contra el código del
    backend, revisado el 13/10/2026 en la rama `main` (commit `260d31e`). Esas operaciones pasan de
    *implementadas en el frontend* o *propuestas* a *implementadas en el backend*. Agrega
    `GET /users/{id}/`, el `502` de `POST /users/` cuando no sale el correo y los registros del
    log hechos por el sistema (`usuario_id` y `rol` en `null`). También documenta que
    `GET /conceptos/` devuelve `descripcion: ""` cuando la base la tiene vacía.

    La **versión 0.7** (14/10/2026) recoge los arreglos del backend en la rama
    `fix/api-mensajes-seguridad-auditoria` (PR #34 a `dev`, sin fusionar todavía): cuerpo opcional
    `{ motivo }` en `POST /auth/logout/` (AF), `404` en JSON para rutas inexistentes (AD), el texto
    del `409` sin la ruta de la API (AC) y la auditoría que ya no tumba una acción si falla (AG).
    Nada de esto rompe al frontend actual: el backend sigue aceptando un logout sin cuerpo.

    La **versión 0.8** (14/10/2026) documenta `ejecutada_por` con el nombre de quien generó el corte
    (fila 42, diferencia Y), en la misma rama del backend. Necesita aplicar antes en Oracle
    `config/sql/09_fila42_nv_corte_usuario.sql`. No cambia la forma de la respuesta.

    La **versión 0.9** (07/11/2026) agrega la **Iteración 2**: HU-B (ciclo de vida y estados: RF10–RF19,
    RF45–RF49) y HU-C (generación y transmisión del reporte: RF20–RF24, RF50–RF55, RF57). Todo lo nuevo
    es **propuesta**: el backend todavía no lo implementa y el frontend lo construye contra mocks con
    los ejemplos de este archivo (las 12 obligaciones ficticias del mockup v3). Lo aprueba José Luis
    antes de que el equipo programe contra él; si una ruta cambia, se cambia primero aquí. Decisiones
    (fila 27 del README): nombres en snake_case completos (como las columnas de la base); el ciclo
    mensual (`POST /ciclos/`) trabaja sobre el corte en `BORRADOR` que crea la extracción, con el orden
    extracción → ciclo → validar → archivo → envío; `validar` y `registrar-envio` siguen para los dos
    roles y solo cambian su respuesta (por eso las validaciones, la generación, la lista y la descarga del
    archivo también son de los dos roles; la pantalla 12 es del Analista); los demás endpoints nuevos son
    del **Analista de Cartera**, salvo RF48
    y RF57 (Administrador) y las lecturas de `/entidad/` y `/catalogos/`, que son de los dos roles.
    `EstadoCorte` suma `ENVIADO_CON_INCONSISTENCIAS` (RF54). Los reclamos (pantalla 13) y las
    novedades (pantalla 14) son una propuesta para que Omar y Angel la revisen. Lo que depende de CENS
    o de TransUnion llega marcado con `confirmado: false` o `por_confirmar: true`: nunca se inventa.
    En la Iteración 2 se paginan `/obligaciones/` y `/eliminaciones/`; los demás listados nuevos son
    arreglos planos.

    ## Reglas generales

    **Sesión y CSRF.** Sesión por cookie de Django (`sessionid`, HttpOnly). Para métodos que
    modifican datos (POST, PATCH, PUT, DELETE) el cliente envía el token CSRF en el encabezado
    `X-CSRFToken`, leído de la cookie `csrftoken` (se obtiene con `GET /auth/csrf/`). No se usan
    tokens en `localStorage`.

    **Inactividad (RF26).** La sesión vence a los 10 minutos sin actividad (vencimiento deslizante:
    cada petición la renueva). El frontend llama a `GET /auth/me/` cada ~5 minutos mientras el
    usuario trabaja para renovarla. Al vencer, cualquier endpoint responde `401`.

    **Roles (RF27).** `ANALISTA_CARTERA` (Analista de Cartera) y `ADMINISTRADOR` (Administrador),
    los códigos que ya usa el backend en `request.user.rol`; el frontend los traduce a texto. Cada
    operación indica sus roles en `x-roles`. `x-roles` usa los nombres legibles; el valor en la API
    es el código de `Rol`. Un rol sin permiso recibe `403`; sin sesión, `401`.

    **Primer ingreso.** Un usuario con `must_change_password = true` solo puede usar las rutas de
    `/auth/` (entre ellas `/auth/me/`, `/auth/logout/` y `/auth/change-password/`) y `/salud/`; el
    resto responde `403` con `code: "password_change_required"`. Un usuario desactivado pierde la
    sesión abierta en su siguiente petición (`401`).

    **Errores.** Formato de DRF, siempre en español (RF31):
    `{ "detail": "..." }` para errores generales o `{ "campo": ["mensaje", ...] }` para errores de
    validación (`400`). Los errores generales pueden traer un `code` estable para distinguirlos
    (por ejemplo, un `403` por CSRF de uno por permisos). La extracción y el historial del backend
    responden con `{ detail }` en español también para reglas de negocio con `400`, `404` y `409`
    (fecha futura, grupo inexistente o inactivo, corte en otro estado); solo la validación del
    cuerpo (campo ausente o con formato inválido) llega por campo. Una ruta que no existe responde
    `404` con `{ "detail": "Recurso no encontrado." }` en JSON, no con la página HTML de Django
    (0.7; diferencia AD, rama `fix/api-mensajes-seguridad-auditoria`).

    **Formatos.** JSON UTF-8. Fechas y horas en ISO 8601 con zona (`America/Bogota`, UTC−05:00).
    Fechas de corte como `YYYY-MM-DD`. Montos en pesos colombianos como número (sin símbolo ni
    separadores). Las contraseñas nunca se devuelven (la temporal se envía por correo).

    **Paginación.** Una sola convención para toda la API. Los listados que pueden crecer
    (obligaciones de un corte, detalle de un reporte enviado, búsqueda de deudores y `/auditoria/`)
    usan `?limite=` (por defecto 20) y `?desplazamiento=` (por defecto 0, filas que se saltan) y
    responden `{ total, resultados }`, con `total` igual al número de registros que cumplen el
    filtro. Los listados pequeños o acotados devuelven un **arreglo plano** sin paginar: `/users/`,
    `/conceptos/`, `/grupos-conceptos/`, `/extracciones/` y `/historial/reportes/`. `limite` va de
    1 a 100 (un valor mayor se recorta a 100) y `desplazamiento` desde 0; fuera de rango responde
    `400` con su propio mensaje. El backend ya lo cumple (rama `dev`).

    **Datos reservados.** Los datos de CENS son confidenciales: el log de auditoría no guarda
    contraseñas ni datos personales de deudores (sí guarda el correo del usuario creado o editado;
    diferencia AE del README). `numero_identificacion` llega **enmascarado** en las
    obligaciones de un corte y en el detalle histórico (solo los últimos 4 dígitos).
    El frontend lo vuelve a enmascarar en pantalla por si acaso.

    ## Fuera de alcance de este contrato (no construir sin confirmar)
    "Cambiar datos", "Cambiar de perfil" y exportar log/resumen aparecen en la maqueta pero no
    en los RF de la Iteración 1. `POST /demo/switch-profile/` existe solo en los mocks del
    frontend; el backend real **no** lo tendrá. Los **grupos de conceptos** (RF43) sí están en el
    contrato porque el backend ya los implementó; hay que confirmar que RF43 forme parte del
    alcance documentado (no figura en la Planificación ni en la Asignación). Lo mismo ocurre con
    RF44 (extracción por grupo de conceptos).
  contact:
    name: Equipo NexoVolt — Seminario Integrador 3

