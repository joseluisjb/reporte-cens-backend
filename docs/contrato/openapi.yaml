          description: La matriz completa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatrizEstados' }
              example:
                tipo_cartera: 2
                estados: ['01', '02', '04', '08', '06', '07', '03', '10', '11', '12']
                transiciones:
                  - { desde: '01', desde_con_mora: false, hacia: '02', hacia_con_mora: false, permitida: true }
                  - { desde: '01', desde_con_mora: true, hacia: '03', hacia_con_mora: true, permitida: true }
                  - { desde: '02', desde_con_mora: false, hacia: '01', hacia_con_mora: false, permitida: false }
                  - { desde: '03', desde_con_mora: true, hacia: '07', hacia_con_mora: false, permitida: true }
