security:
  - sessionCookie: []

paths:
  # ───────────────────────── Autenticación ─────────────────────────
  /auth/csrf/:
    get:
      tags: [Autenticación]
      summary: Obtener la cookie CSRF
      description: Entrega la cookie `csrftoken` (`ensure_csrf_cookie`). *Implementado en el backend.*
      operationId: authCsrf
      security: []
      x-roles: [público]
      responses:
        '204':
          description: Cookie `csrftoken` entregada.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`csrftoken=...; SameSite=Lax`"

  /auth/login/:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión (RF25)
      description: |
        Valida correo y contraseña y abre la sesión. *Implementado en el backend.*
        Exige el encabezado `X-CSRFToken` aunque no haya sesión. El correo no distingue mayúsculas.
        Un correo que no existe recibe la misma respuesta `401` que una contraseña incorrecta. Un
        usuario desactivado recibe `403` solo si la contraseña es correcta (no se revela nada
        con una contraseña incorrecta). Límite: 10 intentos por minuto por dirección IP y otros 10
        por correo. Cada inicio de sesión exitoso queda en el log de auditoría.
      operationId: authLogin
      security: []
      x-roles: [público]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada. Entrega la cookie `sessionid`.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`sessionid=...; HttpOnly; Secure (en producción); SameSite=Lax`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Correo o contraseña incorrectos.', code: authentication_failed }
        '403':
          description: Usuario desactivado (`user_inactive`) o token CSRF ausente o inválido (`csrf_failed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                desactivado:
                  summary: Usuario desactivado (contraseña correcta)
                  value: { detail: 'Tu usuario está desactivado. Contacta al administrador.', code: user_inactive }
                csrf:
                  summary: Falta el encabezado X-CSRFToken o no coincide
                  value: { detail: 'No se pudo verificar la seguridad de la solicitud. Recarga la página e intenta de nuevo.', code: csrf_failed }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout/:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión (RF26)
      description: |
        Invalida la sesión en el servidor. *Implementado en el backend.* Queda en el log de
        auditoría. El cuerpo es **opcional** (0.7): `motivo: inactividad` deja el detalle
        "Cierre por inactividad"; `manual`, otro valor o ningún cuerpo dejan "Cierre manual". El
        frontend envía `inactividad` cuando vence la sesión (RF26) y `manual` en los demás casos.
        El backend lo implementa en la rama `fix/api-mensajes-seguridad-auditoria` (PR #34, sin
        fusionar); mientras tanto, `main` ignora el cuerpo y todo queda como "Cierre manual"
        (diferencia AF del README).
      operationId: authLogout
      x-roles: [Analista de Cartera, Administrador]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Sesión cerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      description: |
        Devuelve el usuario autenticado. **También sirve de "ping"**: el frontend lo llama cada
        ~5 minutos mientras el usuario trabaja para renovar la sesión. *Implementado en el backend.*
      operationId: authMe
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password/:
    post:
      tags: [Autenticación]
      summary: Cambiar la contraseña propia (RF28)
      description: |
        Usado en el cambio obligatorio del primer ingreso y en cualquier cambio voluntario.
        Pone `must_change_password = false`. Reglas de la nueva contraseña: mínimo 8 caracteres,
        al menos una mayúscula y al menos un número; además, el backend rechaza una contraseña
        común, una que se parezca al correo o al nombre y una igual a la actual. La sesión actual
        sigue abierta y las demás sesiones del usuario se cierran. Queda en el log de auditoría.
        *Implementado en el backend.*
      operationId: authChangePassword
      x-roles: [Analista de Cartera, Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Contraseña cambiada. }
        '400':
          description: Validación por campo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example:
                current_password: ['La contraseña actual no es correcta.']
                new_password: ['La contraseña debe tener al menos una mayúscula.']
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/:
    post:
      tags: [Autenticación]
      summary: Solicitar enlace de recuperación (RF29)
      description: |
        Responde **siempre igual (`202`)**, exista o no el correo, para no revelar qué correos están
        registrados. Si el correo existe y el usuario está activo, se envía un enlace
        `{FRONTEND_URL}/restablecer?token=XXXX` de **un solo uso** que vence en 30 minutos. El
        token tiene la forma `uidb64.token`. Límite: 5 solicitudes por hora por dirección IP.
        *Implementado en el backend.*
      operationId: authPasswordReset
      security: []
      x-roles: [público]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Solicitud recibida (siempre la misma respuesta).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Si el correo está registrado, recibirás un enlace.' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm/:
    post:
      tags: [Autenticación]
      summary: Restablecer la contraseña con el token (RF29)
      description: |
        El token es de un solo uso. Pone `must_change_password = false`. Comparte con
        `/auth/password-reset/` el límite de 5 intentos por hora por dirección IP. Queda en el log de
        auditoría. *Implementado en el backend.*
      operationId: authPasswordResetConfirm
      security: []
      x-roles: [público]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Contraseña restablecida. }
        '400':
          description: Token vencido, ya usado o contraseña inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { token: ['El enlace no es válido o ya venció.'] }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────── Usuarios ─────────────────────────
  /users/:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (RF28)
      description: "*Implementado en el backend.*"
      operationId: usersList
      x-roles: [Administrador]
      responses:
        '200':
          description: Todos los usuarios, activos e inactivos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Crear usuario (RF28)
      description: |
        Crea el usuario con `must_change_password = true` y genera una **contraseña temporal que se
        envía por correo** al usuario (decisión del equipo). La respuesta **no** incluye la
        contraseña: `temporary_password` viene en `null` o ausente, y el frontend muestra "La
        contraseña temporal se envió a su correo". La contraseña temporal tiene 12 caracteres, con
        mayúscula, minúscula, número y símbolo. El backend envía el correo por un servicio externo
        (Google Apps Script) y, si el envío falla, **no crea el usuario** y responde `502`. Por eso
        para probar este flujo hace falta un buzón real del probador. El correo es único. Queda en
        el log de auditoría. *Implementado en el backend.*
      operationId: usersCreate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreatedResponse' }
        '400':
          description: Validación por campo (correo repetido, rol inválido, campos vacíos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { email: ['Ya existe un usuario con ese correo.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: No se pudo enviar el correo con la contraseña temporal; la creación se revierte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'No se pudo enviar el correo con la contraseña temporal. El usuario no fue creado.' }

  /users/{id}/:
    get:
      tags: [Usuarios]
      summary: Detalle de un usuario (RF28)
      description: |
        Mismo objeto que un elemento del listado. *Implementado en el backend.* El frontend no lo
        usa: la pantalla de usuarios trabaja con el listado.
      operationId: usersRetrieve
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Usuario (objeto `user` directo, sin envoltura).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Usuarios]
      summary: Editar, activar o desactivar un usuario (RF28)
      description: |
        Sirve para editar datos y para activar/desactivar (`is_active`). No hay `DELETE`: los
        usuarios se desactivan, no se borran.

        Reglas del servidor: un administrador **no puede desactivarse a sí mismo** ni
        **cambiarse su propio rol**. Queda en el log de auditoría como usuario editado, activado o
        desactivado según el cuerpo. *Implementado en el backend.*
      operationId: usersUpdate
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Usuario actualizado (objeto `user` directo, sin envoltura).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Validación por campo o regla de negocio sobre el propio usuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              examples:
                desactivar_propio:
                  summary: Intenta desactivar su propio usuario
                  value: { is_active: ['No puedes desactivar tu propio usuario.'] }
                cambiar_propio_rol:
                  summary: Intenta cambiar su propio rol
                  value: { rol: ['No puedes cambiar tu propio rol.'] }
                correo_repetido:
                  summary: Correo ya registrado
                  value: { email: ['Ya existe un usuario con ese correo.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Utilidades ─────────────────────────
  /salud/:
    get:
      tags: [Utilidades]
      summary: Verificar que el servidor responde
      description: Sin sesión. *Implementado en el backend.*
      operationId: salud
      security: []
      x-roles: [público]
      responses:
        '200':
          description: Servidor disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }

  # ───────────────────────── Conceptos de energía (RF35) ─────────────────────────
  /conceptos/:
    get:
      tags: [Conceptos de energía]
      summary: Listar códigos de concepto de energía (RF35)
      description: |
        Tabla de parámetros que define qué conceptos de facturación son energía (en Oracle,
        `NV_CONCEPTO_REPORTABLE`, columna `REPORTABLE`). La extracción lee **solo los códigos
        activos**. Sin paginación. La búsqueda por texto se hace en el cliente. Si la columna
        `DESCRIPCION` está vacía en la base, `descripcion` llega como `""` (desde `a7f7ecc`).
        *Implementado en el backend.*
      operationId: conceptosList
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: activo
          in: query
          description: Solo `true` o `false` en minúsculas; cualquier otro valor se ignora y devuelve todos.
          schema: { type: boolean }
      responses:
        '200':
          description: Códigos de concepto.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Concepto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Conceptos de energía]
      summary: Agregar un código de concepto (RF35)
      description: |
        Se crea activo salvo que se indique lo contrario. El código es único: si ya existe responde
        `409`. Una `descripcion` vacía o de solo espacios responde `400` por campo.
        *Implementado en el backend.* Solo el Administrador. Queda en el log de auditoría.
      operationId: conceptosCreate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConceptoCreateRequest' }
      responses:
        '201':
          description: Código creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Concepto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El código ya existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El código de concepto ya existe.' }

  /conceptos/{codigo}/:
    patch:
      tags: [Conceptos de energía]
      summary: Editar, activar o desactivar un código (RF35)
      description: |
        Cambiar `activo` no borra el código: deja de usarse en las próximas extracciones y se conserva
        para el historial. No hay `DELETE` ni se puede cambiar el `codigo`. Un cuerpo vacío devuelve
        el recurso sin cambios. Si se envía `descripcion`, no puede estar vacía ni ser de solo
        espacios (`400`). *Implementado en el backend.* Queda en el log de auditoría (como concepto
        desactivado cuando el cuerpo trae `activo: false`).
      operationId: conceptosUpdate
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConceptoUpdateRequest' }
      responses:
        '200':
          description: Código actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Concepto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El concepto no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Concepto no encontrado.' }

  # ───────────────────────── Grupos de conceptos (RF43) ─────────────────────────
  /grupos-conceptos/:
    get:
      tags: [Grupos de conceptos]
      summary: Listar grupos de conceptos (RF43)
      description: |
        Un grupo agrupa conceptos de energía para elegirlo al ejecutar una extracción (maqueta 5 y 6).
        Sin paginación. *Implementado en el backend.*
      operationId: gruposList
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Grupos con sus conceptos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrupoConcepto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Grupos de conceptos]
      summary: Crear un grupo de conceptos (RF43)
      description: |
        El nombre es único. Todos los conceptos deben existir y estar activos, sin repetidos.
        *Implementado en el backend.* Escribir grupos es solo del Administrador.
      operationId: gruposCreate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoConceptoCreateRequest' }
      responses:
        '201':
          description: Grupo creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoConcepto' }
        '400':
          description: Validación por campo, o un concepto que no existe o no está activo.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorCampos'
                  - $ref: '#/components/schemas/ErrorDetail'
              example: { detail: 'El concepto 3587 no existe o no está activo.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe un grupo con ese nombre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El nombre de grupo ya existe.' }

  /grupos-conceptos/{id}/:
    get:
      tags: [Grupos de conceptos]
      summary: Detalle de un grupo de conceptos (RF43)
      description: "*Implementado en el backend.*"
      operationId: gruposRead
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Grupo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoConcepto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El grupo no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Grupo no encontrado.' }
    patch:
      tags: [Grupos de conceptos]
      summary: Editar, activar o desactivar un grupo (RF43)
      description: |
        `conceptos` **reemplaza la lista completa** del grupo. Un cuerpo vacío devuelve el recurso
        sin cambios. *Implementado en el backend.*
      operationId: gruposUpdate
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoConceptoUpdateRequest' }
      responses:
        '200':
          description: Grupo actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoConcepto' }
        '400':
          description: Validación por campo, o un concepto que no existe o no está activo.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorCampos'
                  - $ref: '#/components/schemas/ErrorDetail'
              example: { detail: 'El concepto 3587 no existe o no está activo.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El grupo no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Grupo no encontrado.' }
        '409':
          description: Ya existe otro grupo con ese nombre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El nombre de grupo ya existe.' }
    delete:
      tags: [Grupos de conceptos]
      summary: Eliminar un grupo de conceptos (RF43)
      description: |
        Responde `409` si el grupo está asociado a un corte en estado `BORRADOR`. *Implementado en el
        backend.* Queda en el log de auditoría.
      operationId: gruposDelete
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Grupo eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El grupo no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Grupo no encontrado.' }
        '409':
          description: El grupo está asociado a un corte en borrador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El grupo está asociado a un corte en estado BORRADOR.' }

  # ───────────────────────── Extracción de cartera (RF1–RF5, RF7, RF44) ─────────────────────────
  /extracciones/:
    get:
      tags: [Extracción]
      summary: Listar los cortes ("Registro de extracciones")
      description: |
        Todos los cortes **excepto los `ANULADO`**, del más reciente al más antiguo según
        `fecha_ejecucion`. Alimenta la tabla de registro de la pantalla 5. Es un arreglo plano, sin
        paginación (el backend no pagina este listado). *Implementado en el backend.*
      operationId: extraccionesList
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Cortes no anulados, de más reciente a más antiguo. Puede ser `[]`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CorteResumen' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Extracción]
      summary: Generar un corte de cartera (RF1–RF5, RF7, RF44)
      description: |
        Extrae los deudores con financiación vigente (RF1), aísla los conceptos de energía (RF2,
        RF35), consolida pagos y saldos (RF3, RF4), calcula días y edad de mora (RF7) y unifica el
        número de obligación (RF5). Deja el corte en estado `BORRADOR`. *Implementado en el backend.*

        **Es síncrono:** la respuesta llega cuando el corte ya está generado (`201`); no hay
        `202` ni consulta periódica del estado.

        `grupo_id` es opcional: con un grupo solo se consideran los conceptos de ese grupo (RF43);
        sin grupo (omitido o `null`) se usan **todos** los conceptos con `REPORTABLE = 'S'`.

        **Reglas:** la fecha de corte no puede ser futura. Si ya existe un corte con **esa misma
        fecha en `BORRADOR`**, se reemplaza (se borran sus filas y se vuelve a calcular) y conserva
        el mismo `id`. Si existe uno con esa fecha en cualquier otro estado, responde `409`. Solo
        puede haber **un** `BORRADOR` a la vez: si hay uno con otra fecha, responde `409`.

        **Contrato 0.4 (manual de TransUnion, inconsistencia 074):** la fecha de corte
        debe ser **posterior** a la del último corte enviado (`ENVIADO`); si es igual o anterior,
        responde `409`. Implementado en el backend (`DISCREPANCIAS.md`, A9). Desde la 0.9, «enviado»
        incluye `ENVIADO_CON_INCONSISTENCIAS` (RF54).

        **Si hay un `BORRADOR` equivocado** de otra fecha, se elimina con
        `DELETE /extracciones/{id}/` y se vuelve a generar.
      operationId: extraccionesCreate
      x-roles: [Analista de Cartera, Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorteCreateRequest' }
      responses:
        '201':
          description: Corte generado en estado `BORRADOR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorteResumen' }
              example:
                id: 1
                fecha_corte: '2026-09-30'
                fecha_ejecucion: '2026-10-10T12:00:00-05:00'
                grupo: { id: 1, nombre: Grupo ficticio A }
                obligaciones: 150
                saldo_consolidado: 45000000
                estado: BORRADOR
                ejecutada_por: null
        '400':
          description: |
            Fecha de corte futura (`{ detail }`) o error de validación del cuerpo por campo
            (`fecha_corte` ausente o con formato inválido, `grupo_id` menor que 1 o no entero).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDetail'
                  - $ref: '#/components/schemas/ErrorCampos'
              examples:
                fecha_futura:
                  summary: Fecha de corte futura
                  value: { detail: 'La fecha de corte no puede ser futura.' }
                fecha_corte_faltante:
                  summary: Falta la fecha de corte
                  value: { fecha_corte: ['Selecciona una fecha de corte.'] }
                fecha_corte_invalida:
                  summary: Fecha de corte con formato inválido
                  value: { fecha_corte: ['La fecha de corte no es válida.'] }
                grupo_invalido:
                  summary: "`grupo_id` menor que 1 o no entero"
                  value: { grupo_id: ['El grupo de conceptos no es válido.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El grupo indicado no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Grupo no encontrado.' }
        '409':
          description: |
            Grupo inactivo, corte existente que no se puede reemplazar, ya hay un borrador de otra
            fecha o la fecha de corte no es posterior a la del último corte enviado. El texto del
            borrador de otra fecha ya no incluye la ruta de la API: el backend lo corrigió en la
            rama `fix/api-mensajes-seguridad-auditoria` (PR #34, sin fusionar; diferencia AC del
            README). Hasta que se fusione, `main` todavía muestra `DELETE /api/extracciones/{id}/`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                grupo_inactivo:
                  summary: El grupo está inactivo
                  value: { detail: 'El grupo está inactivo.' }
                estado_fijo:
                  summary: Ya hay un corte con esa fecha que no es BORRADOR
                  value: { detail: 'Ya existe un corte con esa fecha en un estado que no permite reemplazo.' }
                borrador_otra_fecha:
                  summary: Hay un BORRADOR de otra fecha
                  value: { detail: 'Ya existe un corte en BORRADOR con fecha 2026-08-31. Elimínelo o complételo antes de generar otro.' }
                fecha_no_posterior:
                  summary: La fecha de corte no es posterior a la del último corte enviado (A9)
                  value: { detail: 'La fecha de corte debe ser posterior a la del último corte enviado.' }

  /extracciones/ultima/:
    get:
      tags: [Extracción]
      summary: Último corte procesado
      description: |
        El corte más reciente según `fecha_ejecucion`, sin contar los `ANULADO`. Alimenta el dato
        "Último corte procesado" del panel. Si todavía no hay ningún corte responde `204` **sin
        cuerpo**. *Implementado en el backend.*
      operationId: extraccionesUltima
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Último corte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorteResumen' }
        '204':
          description: Aún no hay cortes. Sin cuerpo.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /extracciones/{id}/:
    get:
      tags: [Extracción]
      summary: Detalle de un corte
      description: |
        Resumen de un corte, en cualquier estado (también `ANULADO`). *Implementado en el backend.*
      operationId: extraccionesRead
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Corte.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorteResumen' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }
    delete:
      tags: [Extracción]
      summary: Eliminar un corte en BORRADOR
      description: |
        Borra un corte que está en `BORRADOR`, junto con sus obligaciones e inconsistencias, y deja
        la eliminación en la bitácora (`NV_BITACORA`, acción `ELIMINACION_BORRADOR`). Sirve para
        salir de un borrador equivocado, porque solo puede haber uno a la vez. Un corte en otro
        estado no se puede eliminar (`409`). Implementado en el backend. En el log de auditoría
        aparece como "Corte eliminado" (`tipo_accion: eliminacion`).
      operationId: extraccionesDelete
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Corte eliminado. Sin cuerpo. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }
        '409':
          description: El corte no está en `BORRADOR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Solo se puede eliminar un corte en estado BORRADOR.' }

  /extracciones/{id}/obligaciones/:
    get:
      tags: [Extracción]
      summary: Obligaciones de un corte (RF3–RF5, RF7)
      description: |
        Una fila por **obligación**, es decir, por **proceso de financiación** (no por deudor): un
        deudor con dos financiaciones aparece con dos obligaciones (Acta 2 y Manual TransUnion v34).
        Cada fila trae el titular, el estado y la edad de mora (Tabla 9), los días y las cuotas en
        mora, el valor en mora y el saldo. Ordenado por `OBLIGACION_ID`. Se pagina con `limite` y
        `desplazamiento`. Disponible en cualquier estado del corte. *Implementado en el backend.*

        **Contenido del corte (contrato 0.4, manual de TransUnion).** Un corte puede incluir las
        obligaciones que se **cerraron desde el corte anterior**, reportadas con `estado_tu` `02`
        (Saldada), `valor_saldo`, `valor_mora`, `valor_cuota` y `cuotas_mora` en `0` y `edad_mora`
        `'00'`. Según el manual, una obligación se cierra reportándola como Saldada; la que deja de
        reportarse queda como "no reportada" ante TransUnion. Hoy el backend excluye las obligaciones
        con saldo 0 (`DISCREPANCIAS.md`, A2). **Pendiente de confirmar por Santiago**, porque RF1
        dice "solo vigentes".

        **Dato personal:** `numero_identificacion` llega enmascarado (`NumeroIdentificacion`).
      operationId: extraccionesObligaciones
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Desplazamiento'
      responses:
        '200':
          description: Página de obligaciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListaPaginada'
                  - type: object
                    properties:
                      resultados:
                        type: array
                        items: { $ref: '#/components/schemas/ObligacionCorte' }
              example:
                total: 150
                resultados:
                  - numero_obligacion: OBL0001
                    nombre_titular: TITULAR FICTICIO UNO
                    numero_identificacion: '******0001'
                    estado_tu: '01'
                    edad_mora: '00'
                    dias_mora: 0
                    cuotas_mora: 0
                    valor_mora: 0
                    valor_saldo: 500000
                    n_creditos: 1
                  - numero_obligacion: OBL0002
                    nombre_titular: TITULAR FICTICIO DOS
                    numero_identificacion: '******0002'
                    estado_tu: '02'
                    edad_mora: '00'
                    dias_mora: 0
                    cuotas_mora: 0
                    valor_mora: 0
                    valor_saldo: 0
                    n_creditos: 1
        '400':
          description: '`limite` o `desplazamiento` no son enteros, o están fuera de rango (`limite` menor que 1 o `desplazamiento` negativo).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                no_enteros:
                  summary: No son números enteros
                  value: { detail: 'Los parámetros limite y desplazamiento deben ser enteros.' }
                fuera_de_rango:
                  summary: "`limite` menor que 1 o `desplazamiento` negativo"
                  value: { detail: 'El límite debe ser mayor que 0 y el desplazamiento no puede ser negativo.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }

  # ───────────────────────── Ciclo de corte (validar y registrar el envío) ─────────────────────────
  /extracciones/{id}/validar/:
    post:
      tags: [Ciclo de corte]
      summary: Validar un corte (BORRADOR a VALIDADO)
      description: |
        Revisa el corte contra las reglas de validación. Sin cuerpo. Si alguna regla de severidad
        **correctiva** falla, responde `409` con la lista `errores` y el corte **sigue en
        `BORRADOR`**. Si no hay errores correctivos, lo pasa a `VALIDADO` y devuelve el resumen con
        las `advertencias` (reglas informativas; puede ser `[]`), que no bloquean. Solo se puede
        validar un corte en `BORRADOR`. *Implementado en el backend.*

        **0.9 (propuesta, RF53):** aplica todas las reglas del Manual de `GET /extracciones/{id}/validaciones/`.
        Cada elemento de `errores` y de `advertencias` puede traer además `obligacion_id`,
        `numero_obligacion` y `campo`, para que la pantalla enlace a la obligación. Los roles no cambian.

        **0.9.3:** `ACTUALIZACION_MENSUAL` es correctiva y se exige **siempre**: si el corte no tiene
        una actualización mensual ejecutada (`POST /ciclos/`), responde `409` con esa regla en
        `errores` (mockup v3, validaciones de la pantalla 12). No es un `409` aparte.
      operationId: extraccionesValidar
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Corte validado, ahora en `VALIDADO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorteValidado' }
              example:
                id: 1
                fecha_corte: '2026-09-30'
                fecha_ejecucion: '2026-10-10T12:00:00-05:00'
                grupo: null
                obligaciones: 150
                saldo_consolidado: 45000000
                estado: VALIDADO
                ejecutada_por: null
                advertencias:
                  - { regla: SIN_FECHA_LIMITE_PAGO, mensaje: No se encontró una factura con fecha de vencimiento. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }
        '409':
          description: El corte no está en `BORRADOR` o tiene errores correctivos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCorrectivo' }
              examples:
                no_borrador:
                  summary: El corte ya no está en BORRADOR
                  value: { detail: 'El corte no está en estado BORRADOR.' }
                errores_correctivos:
                  summary: Errores correctivos
                  value:
                    detail: 'El corte tiene errores correctivos que deben resolverse.'
                    errores:
                      - { regla: SIN_IDENTIFICACION, mensaje: Falta el tipo o el número de identificación }
                sin_actualizacion_mensual:
                  summary: Falta la actualización mensual del corte (0.9.3)
                  value:
                    detail: 'El corte tiene errores correctivos que deben resolverse.'
                    errores:
                      - { regla: ACTUALIZACION_MENSUAL, mensaje: 'Falta ejecutar la actualización mensual de este corte.' }
                errores_por_obligacion:
                  summary: Errores correctivos con la obligación (0.9)
                  value:
                    detail: 'El corte tiene errores correctivos que deben resolverse.'
                    errores:
                      - { regla: CIERRE_INCOMPLETO, mensaje: 'Falta la fecha de pago del cierre.', obligacion_id: 3, numero_obligacion: 2259-1092, campo: fecha_pago }
                      - { regla: NUMERO_OBLIGACION_INVALIDO, mensaje: 'El número de obligación tiene más de 20 caracteres.', obligacion_id: null, numero_obligacion: 2260-5543-REFINANC-01, campo: numero_obligacion }

  /extracciones/{id}/registrar-envio/:
    post:
      tags: [Ciclo de corte]
      summary: Registrar el envío a TransUnion (VALIDADO a ENVIADO)
      description: |
        Registra que el archivo se cargó manualmente en el portal de TransUnion y pasa el corte a
        `ENVIADO`; desde ahí aparece en el historial de reportes. El cuerpo es opcional: sin
        `fecha_envio` (o con `null`) se usa la fecha de hoy. Solo se puede registrar el envío de un
        corte en `VALIDADO`. Esta operación **no** devuelve `errores`. *Implementado en el backend.*

        `fecha_envio` no puede ser futura ni anterior a la fecha de corte. El backend comprueba
        primero que el corte exista (`404`) y después las fechas; un formato de fecha inválido sí
        se rechaza antes (`400` por campo). Lo de la fecha de corte y el orden ya están implementados en
        el backend.

        **0.9 (propuesta, RF20, RF54, RF57):** exige que el corte tenga un archivo generado
        (`POST /extracciones/{id}/archivo/`) y que el último sea **apto para envío**; si no, responde `409`.
        El archivo queda con `enviado: true` y su `fecha_envio`. Los roles no cambian.
      operationId: extraccionesRegistrarEnvio
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarEnvioRequest' }
      responses:
        '200':
          description: Corte enviado, ahora en `ENVIADO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorteResumen' }
              example:
                id: 1
                fecha_corte: '2026-09-30'
                fecha_ejecucion: '2026-10-10T12:00:00-05:00'
                grupo: null
                obligaciones: 150
                saldo_consolidado: 45000000
                estado: ENVIADO
                ejecutada_por: null
        '400':
          description: Fecha de envío futura o anterior a la fecha de corte (`{ detail }`), o con formato inválido (error por campo).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorDetail'
                  - $ref: '#/components/schemas/ErrorCampos'
              examples:
                fecha_futura:
                  summary: Fecha de envío futura
                  value: { detail: 'La fecha de envío no puede ser futura.' }
                anterior_al_corte:
                  summary: Fecha de envío anterior a la fecha de corte
                  value: { detail: 'La fecha de envío no puede ser anterior a la fecha de corte.' }
                fecha_invalida:
                  summary: Fecha de envío con formato inválido
                  value: { fecha_envio: ['La fecha de envío no es válida.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El corte no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Corte no encontrado.' }
        '409':
          description: El corte no está en `VALIDADO`, no tiene archivo o su archivo no es apto para envío (0.9).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                no_validado:
                  summary: El corte no está en VALIDADO
                  value: { detail: 'El corte no está en estado VALIDADO.' }
                sin_archivo:
                  summary: Sin archivo generado (0.9)
                  value: { detail: 'Primero genera el archivo plano del corte.', code: sin_archivo }
                no_apto:
                  summary: Archivo no apto para envío (0.9)
                  value: { detail: 'El archivo no es apto para envío: faltan los datos de la entidad ante TransUnion.', code: archivo_no_apto }

  # ───────────────────────── Historial (RF6, RF8) ─────────────────────────
  /historial/reportes/:
    get:
      tags: [Historial]
      summary: Historial de reportes enviados a TransUnion (RF6)
      description: |
        Los cortes en estado `ENVIADO` (y, desde la 0.9, `ENVIADO_CON_INCONSISTENCIAS`: también se
        enviaron), del envío más reciente al más antiguo. Los filtros `desde`
        y `hasta` se aplican sobre `fecha_envio` y son inclusivos. Arreglo plano, sin paginación.
        Puede ser `[]` mientras no se haya registrado ningún envío. *Implementado en el backend.*
      operationId: historialReportes
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: desde
          in: query
          description: Fecha de envío inicial, inclusive (`AAAA-MM-DD`).
          schema: { type: string, format: date }
        - name: hasta
          in: query
          description: Fecha de envío final, inclusive (`AAAA-MM-DD`).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Reportes enviados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReporteEnviado' }
              example:
                - id: 1
                  fecha_corte: '2026-09-30'
                  fecha_envio: '2026-10-01'
                  total_registros: 150
                  saldo_consolidado: 45000000
                  grupo: Grupo ficticio A
                  observacion: null
        '400':
          description: '`desde` o `hasta` no son fechas válidas.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Los parámetros desde y hasta deben ser fechas en formato AAAA-MM-DD.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /historial/reportes/{id}/detalle/:
    get:
      tags: [Historial]
      summary: Detalle de un reporte enviado (RF6)
      description: |
        Las filas que se enviaron en ese corte, ordenadas por `OBLIGACION_ID` y paginadas con
        `limite` y `desplazamiento`. Solo para cortes enviados (`ENVIADO` o, desde la 0.9,
        `ENVIADO_CON_INCONSISTENCIAS`); en cualquier otro estado responde `404`. Muestra parte de los 22 campos de CENS (ver decisión 13 del README).
        *Implementado en el backend.*

        **Dato personal:** `numero_identificacion` llega enmascarado (`NumeroIdentificacion`).
      operationId: historialReporteDetalle
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Desplazamiento'
      responses:
        '200':
          description: Página del detalle.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListaPaginada'
                  - type: object
                    properties:
                      resultados:
                        type: array
                        items: { $ref: '#/components/schemas/ReporteDetalleFila' }
              example:
                total: 150
                resultados:
                  - numero_obligacion: OBL0001
                    nombre_titular: TITULAR FICTICIO UNO
                    numero_identificacion: '******0001'
                    tipo_id_tu: '01'
                    tipo_cartera: 2
                    estado_tu: '01'
                    edad_mora: '00'
                    fecha_inicio: '2025-01-01'
                    cuotas_mora: 0
                    valor_inicial: 500000
                    valor_mora: 0
                    valor_saldo: 500000
                    valor_cuota: 50000
                    dias_mora: 0
                    origen_dias_mora: SIN_MORA
                    n_creditos: 1
                    fecha_ultimo_pago: null
        '400':
          description: '`limite` o `desplazamiento` no son enteros, o están fuera de rango (`limite` menor que 1 o `desplazamiento` negativo).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                no_enteros:
                  summary: No son números enteros
                  value: { detail: 'Los parámetros limite y desplazamiento deben ser enteros.' }
                fuera_de_rango:
                  summary: "`limite` menor que 1 o `desplazamiento` negativo"
                  value: { detail: 'El límite debe ser mayor que 0 y el desplazamiento no puede ser negativo.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El reporte no existe o el corte no se ha enviado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Reporte no encontrado o no está en estado ENVIADO.' }

  /historial/deudores/:
    get:
      tags: [Historial]
      summary: Buscar obligaciones en el historial de deudores (RF8)
      description: |
        Busca obligaciones por `cliente_id` y/o `numero_obligacion`; hay que enviar **al menos uno**.
        Ordenado por `obligacion_id` y paginado con `limite` y `desplazamiento`
        (`{ total, resultados }`). Cada resultado trae el último estado y saldo registrados, sin
        contar los cortes `ANULADO`; son `null` si la obligación aún no aparece en ningún corte.
        *Implementado en el backend.* Hasta la versión 0.4 era un arreglo plano de máximo 50.
      operationId: historialDeudores
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: cliente_id
          in: query
          description: Id del cliente en el sistema comercial de CENS.
          schema: { type: integer }
        - name: numero_obligacion
          in: query
          schema: { $ref: '#/components/schemas/NumeroObligacion' }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Desplazamiento'
      responses:
        '200':
          description: Página de obligaciones encontradas. `resultados` puede ser `[]`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListaPaginada'
                  - type: object
                    properties:
                      resultados:
                        type: array
                        items: { $ref: '#/components/schemas/DeudorBusqueda' }
              example:
                total: 1
                resultados:
                  - obligacion_id: 1
                    numero_obligacion: OBL0001
                    cliente_id: 900001
                    numero_proceso: 1001
                    fecha_inicio: '2025-01-01'
                    ultimo_estado_tu: '01'
                    ultimo_valor_saldo: 500000
        '400':
          description: No se envió ningún filtro, `cliente_id` no es un entero, o `limite` o `desplazamiento` no son válidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              examples:
                sin_filtro:
                  summary: Ningún filtro
                  value: { detail: 'Debe proporcionar al menos cliente_id o numero_obligacion.' }
                cliente_invalido:
                  summary: cliente_id no numérico
                  value: { detail: 'cliente_id debe ser un entero.' }
                fuera_de_rango:
                  summary: "`limite` menor que 1 o `desplazamiento` negativo"
                  value: { detail: 'El límite debe ser mayor que 0 y el desplazamiento no puede ser negativo.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /historial/deudores/{id}/:
    get:
      tags: [Historial]
      summary: Línea de tiempo de una obligación (RF8)
      description: |
        El estado de la obligación en **cada corte no anulado** donde aparece, del más antiguo al
        más reciente por `fecha_corte`. Incluye cortes en `BORRADOR` y `VALIDADO` (el campo
        `estado_corte` lo indica). `id` es el `obligacion_id` que devuelve la búsqueda.
        *Implementado en el backend.*
      operationId: historialDeudorLineaTiempo
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la obligación (`obligacion_id`).
          schema: { type: integer }
      responses:
        '200':
          description: Línea de tiempo (puede ser `[]` si la obligación no aparece en ningún corte).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeudorLineaTiempo' }
              example:
                - fecha_corte: '2026-08-31'
                  estado_tu: '01'
                  edad_mora: '00'
                  dias_mora: 0
                  cuotas_mora: 0
                  valor_mora: 0
                  valor_saldo: 520000
                  estado_corte: ENVIADO
                - fecha_corte: '2026-09-30'
                  estado_tu: '01'
                  edad_mora: '01'
                  dias_mora: 32
                  cuotas_mora: 1
                  valor_mora: 50000
                  valor_saldo: 500000
                  estado_corte: ENVIADO
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La obligación no existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Obligación no encontrada.' }

  # ───────────────────────── Auditoría (RF30) ─────────────────────────
  /auditoria/:
    get:
      tags: [Auditoría]
      summary: Consultar el log de auditoría (RF30)
      description: |
        Quién, cuándo y qué acción se realizó. Los registros están en `NV_BITACORA`. Un middleware
        (`config.auditoria.RegistroAuditoria`) los crea solos cuando la acción **termina bien**
        (respuesta 2xx): una acción rechazada no deja registro. Más reciente primero (por
        `fecha_hora` y luego por `id`). El detalle **no** contiene contraseñas, tokens ni datos
        personales de deudores. Los registros no se editan ni se borran desde la API. Pagina con
        `limite` y `desplazamiento` y responde `{ total, resultados }`, la misma convención que el
        resto de la API. *Implementado en el backend* (`6f596bb`); la pantalla es de Omar (maqueta 8).

        Acciones que se registran (`accion` es el texto; entre paréntesis, su `tipo_accion`):
        - **Seguridad:** Inicio de sesión (`inicio_sesion`), Cierre de sesión (`cierre_sesion`),
          Contraseña cambiada y Contraseña restablecida (`edicion`).
        - **Usuarios:** Usuario creado (`creacion`), Usuario editado y Usuario activado
          (`edicion`), Usuario desactivado (`desactivacion`).
        - **Parametrización:** Concepto creado, editado y desactivado; Grupo de conceptos creado,
          editado, desactivado y eliminado (`creacion`, `edicion`, `desactivacion`, `eliminacion`).
        - **Extracción:** Corte generado y Actualización mensual (`calculo`), Corte validado y Envío
          registrado (`modificacion`), Corte eliminado (`eliminacion`), Consulta de obligaciones,
          de reporte enviado, de deudores y de historial de deudor (`consulta`).

        Nadie produce todavía `generacion`, `exportacion` ni `correccion`: quedan para el
        generador del archivo y la corrección de obligaciones (Iteración 2). Las acciones sin
        usuario (la actualización mensual programada, RF9) llegan con `usuario: "Sistema"` y con
        `usuario_id` y `rol` en `null`.
      operationId: auditoriaList
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Desplazamiento'
        - name: desde
          in: query
          description: Fecha inicial, inclusive (`YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: hasta
          in: query
          description: Fecha final, inclusive (`YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: usuario
          in: query
          description: Id del usuario que realizó la acción (`usuario_id`).
          schema: { type: integer }
        - name: tipo_accion
          in: query
          description: Tipo de acción.
          schema: { $ref: '#/components/schemas/TipoAccion' }
        - name: modulo
          in: query
          schema: { $ref: '#/components/schemas/Modulo' }
      responses:
        '200':
          description: Página de registros de auditoría.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListaPaginada'
                  - type: object
                    properties:
                      resultados:
                        type: array
                        items: { $ref: '#/components/schemas/RegistroAuditoria' }
        '400':
          description: Filtro inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              examples:
                desde:
                  summary: Fecha inicial inválida
                  value: { desde: ['Usa una fecha válida (AAAA-MM-DD).'] }
                hasta:
                  summary: Fecha final anterior a la inicial
                  value: { hasta: ['La fecha final no puede ser anterior a la inicial.'] }
                usuario:
                  summary: Id de usuario no numérico
                  value: { usuario: ['Indica el id numérico del usuario.'] }
                tipo_accion:
                  summary: Tipo de acción desconocido
                  value: { tipo_accion: ['Tipo de acción no válido.'] }
                modulo:
                  summary: Módulo desconocido
                  value: { modulo: ['Módulo no válido.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ═════════════════════════ Iteración 2 · HU-B (ciclo de vida y estados) ═════════════════════════
  # Todo lo que sigue es *propuesta* (contrato 0.9): el backend todavía no lo implementa. Los ejemplos
  # usan las 12 obligaciones ficticias del mockup v3 (docs/iteracion2/NexoVolt_Mockups_Iteracion2_v3.html).

  # ───────────────────────── Obligaciones (pantalla 9) ─────────────────────────
  /obligaciones/:
    get:
      tags: [Obligaciones]
      summary: Listar las obligaciones con su estado actual (RF10–RF19, RF45–RF50)
      description: |
        Una fila por obligación (una financiación), con el estado que tiene según el **último ciclo
        mensual** (`POST /ciclos/`). Incluye las cerradas (Saldada `02` y Cartera Recuperada `07`,
        marcadas con `cerrada: true`) y, con `?eliminada=true`, las eliminadas en TransUnion (RF50).
        Ordenadas por `numero_obligacion`. Pagina con `limite` y `desplazamiento`. *Propuesta.*

        **0.9.3:** `?abierta=true` deja solo las abiertas (no cerradas ni eliminadas, como `abiertas`
        en el resumen); lo usa el formulario de refinanciación (RF18). Un `limite` o `desplazamiento`
        inválido responde `{ detail }`, como la paginación de la extracción; los filtros, por campo.
      operationId: obligacionesList
      x-roles: [Analista de Cartera]
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Desplazamiento'
        - name: estado_tu
          in: query
          description: Solo las obligaciones en este estado (Tabla 4b).
          schema: { $ref: '#/components/schemas/EstadoObligacion' }
        - name: eliminada
          in: query
          description: "`true` = solo las eliminadas en TransUnion (RF50); `false` u omitido = solo las no eliminadas."
          schema: { type: boolean, default: false }
        - name: cuotas_mora_min
          in: query
          description: Solo las que tienen al menos este número de cuotas en mora (la tarjeta del panel usa `2`).
          schema: { type: integer, minimum: 0 }
        - name: q
          in: query
          description: Busca por número de obligación o por nombre del titular (contiene, sin distinguir mayúsculas).
          schema: { type: string, maxLength: 60 }
        - name: abierta
          in: query
          description: "0.9.3. `true` = solo las abiertas: estado distinto de 02 y 07 y no eliminadas (RF18). `false` u omitido = sin este filtro."
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Página de obligaciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListaPaginada'
                  - type: object
                    properties:
                      resultados:
                        type: array
                        items: { $ref: '#/components/schemas/ObligacionResumen' }
              example:
                total: 12
                resultados:
                  - obligacion_id: 7
                    numero_obligacion: 2250-0987
                    nombre_titular: Hotel Mirador Cúcuta
                    numero_identificacion: '******0007'
                    estado_tu: '03'
                    edad_mora: '05'
                    dias_mora: 156
                    cuotas_mora: 6
