        '403': { $ref: '#/components/responses/Forbidden' }

  /ciclos/:
    get:
      tags: [Ciclo mensual]
      summary: Historial de actualizaciones mensuales
      description: Una fila por ciclo ejecutado, del más reciente al más antiguo. Arreglo plano (pocos registros, uno por mes). *Propuesta.*
      operationId: ciclosList
      x-roles: [Analista de Cartera]
      responses:
        '200':
          description: Ciclos ejecutados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CicloResumen' }
              example:
                - corte_id: 2
                  fecha_corte: '2026-09-30'
                  fecha_ejecucion: '2026-09-30T10:02:00-05:00'
                  ejecutada_por: Juan Pérez
                  primer_reporte: 2
                  cambios_estado: 2
                  cierres: 2
                  rechazados: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ciclo mensual]
      summary: Ejecutar la actualización mensual de estados (RF10–RF17, RF19, RF45–RF49)
      description: |
        Calcula el estado, la edad, la mora y los datos de cierre de cada obligación del corte en
        `BORRADOR` de `fecha_corte`, que crea antes la extracción (`POST /extracciones/`, RF1).
        **Orden de trabajo:** extracción → ciclo → validar → archivo → envío. Es **síncrono**:
        responde cuando termina. Volver a ejecutarlo sobre el mismo `BORRADOR` reemplaza el
        resultado anterior.

        Orden de las reglas por obligación (ficha de reparto §4.6): primer reporte (RF10), mora y
        cuotas con los pagos del SAC de la cuota más antigua a la más reciente (RF7, RF17, RF19,
        RF49; regla de imputación por confirmar, C-29), marcas de caducado y castigo (RF14, RF45),
        estado nuevo (RF12, RF15, RF45, RF46, RF14), matriz (713) o primer reporte (881), cierres y
        pago de la mora (RF22, RF47) y edad (RF11). Un cambio rechazado conserva el estado anterior
        y aparece en `rechazos`.

        `fecha_corte` debe ser el último día del mes y posterior a la del último corte **enviado**
        (`400` por campo). Mientras el corte siga en `BORRADOR` se puede volver a ejecutar con la misma
        fecha (por ejemplo, después de corregir el dato en el SAC y regenerar la extracción).

        **Rechazos (713 y 881).** Un rechazo no se resuelve en NexoVolt: se corrige el dato en el origen
        (SAC), se regenera la extracción y se vuelve a ejecutar el ciclo (RF10, flujo alterno). Mientras
        tanto, `GET /extracciones/{id}/validaciones/` lo muestra como `correctiva` con la obligación y
        `validar` no deja pasar el corte. La exclusión de una obligación con justificación (RF10) queda
        **por definir** con José Luis; no tiene endpoint en la 0.9. *Propuesta.*
      operationId: ciclosCreate
      x-roles: [Analista de Cartera]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CicloCreateRequest' }
            example: { fecha_corte: '2026-10-31' }
      responses:
        '201':
          description: Ciclo ejecutado. Devuelve el resultado completo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CicloDetalle' }
              example:
                corte_id: 3
                fecha_corte: '2026-10-31'
                fecha_ejecucion: '2026-11-03T09:15:00-05:00'
                ejecutada_por: Juan Pérez
                primer_reporte: 3
                cambios_estado: 2
                cierres: 1
                rechazados: 1
                con_pagos: 5
                a_dudoso: 1
                a_castigada: 1
                normalizadas: 0
                transiciones:
                  - obligacion_id: 13
                    numero_obligacion: 2265-2208
                    nombre_titular: Panadería La Espiga
                    estado_anterior: null
                    estado_nuevo: '01'
                    edad_anterior: null
                    edad_nueva: '00'
                    primer_reporte: true
                    requiere_revision: false
                    reglas:
                      - { rf: RF10, texto: 'Entra con su estado y su mora reales', por_confirmar: false }
                  - obligacion_id: 2
                    numero_obligacion: 2258-7731
                    nombre_titular: María Fernanda Ortiz
                    estado_anterior: '01'
                    estado_nuevo: '01'
                    edad_anterior: '01'
                    edad_nueva: '01'
                    primer_reporte: false
                    requiere_revision: false
                    reglas:
                      - { rf: RF17, texto: 'Pago de $70.000 aplicado a: cuota del 14/08/2026', por_confirmar: true }
                      - { rf: RF11, texto: '47 días desde la cuota más antigua sin pagar (14/09/2026): edad 01 → 01', por_confirmar: false }
                rechazos:
                  - obligacion_id: 15
                    numero_obligacion: 2267-3361
                    nombre_titular: Taller Mecánico Los Pinos
                    estado_anterior: null
                    estado_calculado: '07'
                    codigo: '881'
                    motivo: 'Error 881: estado no permitido en primer reporte'
        '400':
          description: Fecha de corte inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              examples:
                fin_de_mes:
                  summary: No es el último día del mes
                  value: { fecha_corte: ['El corte es el último día del mes. Para ese mes sería el 31/10/2026.'] }
                anterior:
                  summary: No es posterior al último corte enviado
                  value: { fecha_corte: ['La fecha de corte debe ser posterior al último corte enviado (30/09/2026).'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: No hay un corte en `BORRADOR` de esa fecha.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Primero genera la extracción de ese corte.' }

