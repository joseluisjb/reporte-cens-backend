  # ───────────────────────── Reclamos Habeas Data (pantalla 13 · propuesta, dueño Omar) ─────────────────────────
  /reclamos/:
    get:
      tags: [Reclamos]
      summary: Listar los reclamos de Habeas Data (RF23)
      description: |
        Más reciente primero. Arreglo plano. `vencido` es `true` cuando pasó la fecha límite de
        respuesta (15 días hábiles, prorrogables 8) y sigue abierto. *Propuesta; pantalla de Omar.*
      operationId: reclamosList
      x-roles: [Analista de Cartera]
      parameters:
        - name: estado
          in: query
          schema: { type: string, enum: [EN_RECLAMO, CERRADO] }
      responses:
        '200':
          description: Reclamos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reclamo' }
              example:
                - id: 1
                  obligacion_id: 4
                  numero_obligacion: 2260-5543
                  nombre_titular: Diana Patricia Niño
                  tipologia: { codigo: '02', descripcion: Pago no reflejado, confirmado: false }
                  fecha_radicacion: '2026-09-22'
                  observacion: El titular indica un pago realizado el 15/09.
                  estado: EN_RECLAMO
                  marcacion_generada: false
                  desmarcacion_generada: false
                  fecha_limite_respuesta: '2026-10-14'
                  vencido: false
                  resultado: null
                  fecha_cierre: null
                  observacion_cierre: null
                  registrado_por: Juan Pérez
                  fecha_registro: '2026-09-22T09:15:00-05:00'
        '400':
          description: Filtro inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { estado: ['Estado no válido.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Reclamos]
      summary: Registrar un reclamo (RF23)
      description: La obligación en reclamo **se sigue reportando** en el archivo total. *Propuesta; pantalla de Omar.*
      operationId: reclamosCreate
      x-roles: [Analista de Cartera]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReclamoCreateRequest' }
            example: { obligacion_id: 4, tipologia: '02', fecha_radicacion: '2026-09-22', observacion: El titular indica un pago realizado el 15/09. }
      responses:
        '201':
          description: Reclamo registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reclamo' }
              example:
                id: 1
                obligacion_id: 4
                numero_obligacion: 2260-5543
                nombre_titular: Diana Patricia Niño
                tipologia: { codigo: '02', descripcion: Pago no reflejado, confirmado: false }
                fecha_radicacion: '2026-09-22'
                observacion: El titular indica un pago realizado el 15/09.
                estado: EN_RECLAMO
                marcacion_generada: false
                desmarcacion_generada: false
                fecha_limite_respuesta: '2026-10-14'
                vencido: false
                resultado: null
                fecha_cierre: null
                observacion_cierre: null
                registrado_por: Juan Pérez
                fecha_registro: '2026-09-22T09:15:00-05:00'
        '400':
          description: Datos inválidos (por campo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { tipologia: ['Selecciona una tipología válida de la Ley 1266.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: La obligación ya tiene un reclamo abierto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'La obligación 2260-5543 ya tiene un reclamo abierto.' }

  /reclamos/{id}/cerrar/:
    post:
      tags: [Reclamos]
      summary: Registrar la respuesta y el cierre de un reclamo (RF23)
      description: |
        Deja el reclamo en `CERRADO` con `desmarcacion_generada: false`: entra en el siguiente archivo
        de desmarcación (Reclamos Batch, Manual p. 57). *Propuesta; pantalla de Omar.*
      operationId: reclamosCerrar
