[pytest]
DJANGO_SETTINGS_MODULE = config.settings_pruebas

# Las pruebas de cada app viven en `<app>/tests.py`, que NO coincide con el patrón que pytest
# recolecta por defecto (test_*.py y *_test.py). Sin esta línea las 177 pruebas de cartera,
# historial y parametros no se ejecutan.
python_files = test_*.py *_test.py tests.py
