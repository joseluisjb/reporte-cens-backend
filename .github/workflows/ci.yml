name: CI

# Todo PR debe pasar este flujo antes de fusionarse (regla del equipo, seccion 4 de la
# Asignacion de RF). Las pruebas no tocan Oracle: usan mocks, asi que no hace falta el
# wallet ni la VPN y el flujo corre en cualquier maquina de GitHub.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # Misma version que el Dockerfile, para que el CI falle por lo mismo que produccion.
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar las pruebas
        run: pytest -q
